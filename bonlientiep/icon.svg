<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2118"/>
      <stop offset="1" stop-color="#110d0a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b964"/>
      <stop offset="1" stop-color="#b07d1f"/>
    </linearGradient>
    <radialGradient id="red" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f08a80"/>
      <stop offset="0.45" stop-color="#c9372d"/>
      <stop offset="1" stop-color="#8e1c15"/>
    </radialGradient>
    <radialGradient id="ivory" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.5" stop-color="#f1e2c2"/>
      <stop offset="1" stop-color="#cdb487"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Khung gỗ 4 x 4 lỗ -->
  <rect x="9" y="11" width="46" height="46" rx="7" fill="url(#wood)"/>
  <g fill="#2a1f16">
    <circle cx="15.5" cy="17.5" r="4.3"/><circle cx="26.5" cy="17.5" r="4.3"/><circle cx="37.5" cy="17.5" r="4.3"/>
    <circle cx="15.5" cy="28.5" r="4.3"/><circle cx="26.5" cy="28.5" r="4.3"/>
    <circle cx="15.5" cy="39.5" r="4.3"/>
  </g>
  <!-- Bốn quân đỏ nối chéo, quân ngà làm bệ bên dưới -->
  <g fill="url(#ivory)">
    <circle cx="26.5" cy="50.5" r="4.6"/><circle cx="37.5" cy="50.5" r="4.6"/><circle cx="37.5" cy="39.5" r="4.6"/>
    <circle cx="48.5" cy="50.5" r="4.6"/><circle cx="48.5" cy="28.5" r="4.6"/>
  </g>
  <g fill="url(#red)">
    <circle cx="15.5" cy="50.5" r="4.6"/><circle cx="26.5" cy="39.5" r="4.6"/><circle cx="37.5" cy="28.5" r="4.6"/>
    <circle cx="48.5" cy="17.5" r="4.6"/><circle cx="48.5" cy="39.5" r="4.6"/>
  </g>
</svg>
