<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gin Rummy">
  <meta name="description" content="Gin Rummy">
  <title>Gin Rummy</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var t = JSON.parse(localStorage.getItem('playnine-ginrummy-settings-v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=1">
  <link rel="stylesheet" href="../_kit/cards.css?v=1">
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">Gin Rummy</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <button class="btn-icon" id="btn-new" type="button" data-i18n-attr="aria-label:kit.newGame;title:kit.newGame">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <!-- Bàn nỉ: máy (trên / trái), nọc + chồng bỏ ở giữa, dòng trạng thái -->
      <div class="table" id="table" role="group" data-i18n-attr="aria-label:table.label">
        <div class="opp" id="opp">
          <div class="opp-tag">
            <span class="avatar" id="opp-avatar" aria-hidden="true"></span>
            <span class="opp-text">
              <span class="opp-name" id="opp-name"></span>
              <span class="opp-score" id="opp-score"></span>
            </span>
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
          <div class="opp-hand" id="opp-hand" aria-hidden="true"></div>
          <div class="opp-took" id="opp-took"></div>
        </div>
        <div class="center">
          <button class="deck" id="deck" type="button"><span class="deck-cards" id="deck-cards"></span><span class="deck-count" id="deck-count" aria-hidden="true"></span></button>
          <button class="pile" id="pile" type="button" data-drop="pile"><span class="pile-cards" id="pile-cards"></span></button>
        </div>
        <div class="status" id="status" aria-live="polite">
          <span class="status-log" id="status-log"></span>
          <span class="status-main" id="status-main"></span>
        </div>
      </div>

      <!-- Bạn: điểm + lá lẻ, nút Xếp / Knock / hành động chính, bài trên tay -->
      <div class="mine" id="mine">
        <div class="mine-bar">
          <div class="me-tag">
            <span class="me-line"><span class="me-name" data-i18n="seat.you">You</span><span class="me-score" id="me-score">0</span></span>
            <span class="dw-line"><span data-i18n="hud.deadwood">Deadwood</span> <b id="dw-val">0</b></span>
          </div>
          <button class="btn-icon sort-btn" id="btn-sort" type="button" data-i18n-attr="aria-label:act.sort;title:act.sort">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6v14H3V5zm8 0h4v14h-4V5zm6 0h4v9h-4V5zm0 11h4v3h-4v-3z"/></svg>
          </button>
          <button class="btn btn-ghost knock" id="btn-knock" type="button"><span id="knock-label" data-i18n="act.knock">Knock</span><kbd class="act-key" aria-hidden="true">K</kbd></button>
          <button class="btn btn-primary act" id="btn-act" type="button"><span id="act-label" data-i18n="act.draw">Draw</span><kbd class="act-key" id="act-key" aria-hidden="true">S</kbd></button>
        </div>
        <div class="hand" id="hand" role="group" data-i18n-attr="aria-label:hand.label"></div>
      </div>
    </main>

    <p class="help"><span class="help-keys" data-i18n-html="help.keys"></span><span class="help-touch" data-i18n="help.touch"></span></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Hết ván / hết trận -->
  <div class="modal" id="modal-round" data-locked hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card round-card" role="dialog" aria-modal="true" aria-labelledby="round-title">
      <h2 id="round-title"></h2>
      <p class="modal-text" id="round-text"></p>
      <div class="round-hands" id="round-hands"></div>
      <div class="round-score" id="round-score"></div>
      <table class="final-table" id="final-table" hidden>
        <thead><tr><th></th><th data-i18n="final.you">You</th><th id="final-opp"></th></tr></thead>
        <tbody id="final-rows"></tbody>
      </table>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-next" type="button" data-i18n="round.next">Next round</button>
        <button class="btn btn-primary" id="btn-again" type="button" data-i18n="kit.playAgain" hidden>Play again</button>
      </div>
    </div>
  </div>

  <!-- Bỏ trận đang chơi -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-backdrop" data-close="modal-confirm"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="confirm.title">Start a new match?</h2>
      <p class="modal-text" data-i18n="confirm.text">This match will count as a loss.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-confirm" data-i18n="kit.cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-new" type="button" data-i18n="kit.newGame">New game</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <div class="modal-text help-text" data-i18n-html="help.text"></div>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid">
        <div><dt data-i18n="stats.played">Matches</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.won">Matches won</dt><dd id="stats-won">0</dd></div>
        <div><dt data-i18n="stats.rate">Win rate</dt><dd id="stats-rate">–</dd></div>
        <div><dt data-i18n="stats.rounds">Hands won</dt><dd id="stats-rounds">0</dd></div>
        <div><dt data-i18n="stats.gins">Gins</dt><dd id="stats-gins">0</dd></div>
        <div><dt data-i18n="stats.best">Best match total</dt><dd id="stats-best">–</dd></div>
      </dl>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-name" data-i18n="settings.level">Computer level</span>
          <div class="segmented" data-setting="level">
            <button type="button" data-value="easy" data-i18n="level.easy">Easy</button>
            <button type="button" data-value="medium" data-i18n="level.medium">Medium</button>
            <button type="button" data-value="hard" data-i18n="level.hard">Hard</button>
          </div>
          <span class="setting-desc" data-i18n="settings.levelDesc"></span>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="settings.speed">Computer speed</span>
          <div class="segmented" data-setting="speed">
            <button type="button" data-value="slow" data-i18n="settings.slow">Slow</button>
            <button type="button" data-value="normal" data-i18n="settings.normal">Normal</button>
            <button type="button" data-value="fast" data-i18n="settings.fast">Fast</button>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-text"><span class="setting-name" data-i18n="settings.bigGin">Big gin bonus</span><span class="setting-desc" data-i18n="settings.bigGinDesc"></span></span>
          <input class="switch" type="checkbox" data-setting="bigGin">
        </label>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="../_kit/cards.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
