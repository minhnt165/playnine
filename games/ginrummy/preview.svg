<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Cảnh: nọc + chồng bỏ ở trên, bài trên tay xếp thành bộ (vạch màu), rút một lá vào thành sảnh rồi bật "GIN!". -->
  <style>
    .c { fill: #fffefb; stroke: #0b2e25; stroke-opacity: .3; stroke-width: .8; }
    .back { fill: #6a4cf5; stroke: #fff; stroke-opacity: .7; stroke-width: 1; }
    .r { font: 800 9px system-ui, sans-serif; fill: #c62828; }
    .k { font: 800 9px system-ui, sans-serif; fill: #191b31; }
    .s { font: 700 11px system-ui, sans-serif; }
    .draw { animation: draw 4.4s cubic-bezier(.3,.7,.3,1) infinite; }
    .badge { transform-origin: 112px 42px; animation: badge 4.4s ease-out infinite; }
    .bar3 { animation: bar 4.4s linear infinite; }
    @keyframes draw {
      0%, 12% { transform: translate(-102px, -54px); }
      38%, 100% { transform: translate(0, 0); }
    }
    @keyframes badge {
      0%, 44% { transform: scale(0); opacity: 0; }
      54% { transform: scale(1.18); opacity: 1; }
      60%, 88% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    @keyframes bar {
      0%, 38% { opacity: 0; }
      44%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw, .badge, .bar3 { animation: none; }
    }
  </style>

  <!-- Nọc và chồng bỏ -->
  <rect class="back" x="38" y="8" width="22" height="31" rx="3"/>
  <rect class="back" x="36" y="10" width="22" height="31" rx="3"/>
  <rect class="c" x="70" y="10" width="22" height="31" rx="3"/>
  <text class="k" x="73" y="20">K</text>
  <text class="s" x="77" y="34" fill="#191b31">♣</text>

  <!-- Bài trên tay: sám 5 · sảnh 8-9-10♠ · lá chờ (J♥ Q♥ → K♥ rút vào) -->
  <g>
    <rect class="c" x="6" y="64" width="22" height="31" rx="3"/><text class="r" x="9" y="74">5</text><text class="s" x="12" y="88" fill="#c62828">♥</text>
    <rect class="c" x="20" y="64" width="22" height="31" rx="3"/><text class="k" x="23" y="74">5</text><text class="s" x="26" y="88" fill="#191b31">♠</text>
    <rect class="c" x="34" y="64" width="22" height="31" rx="3"/><text class="r" x="37" y="74">5</text><text class="s" x="40" y="88" fill="#c62828">♦</text>

    <rect class="c" x="54" y="64" width="22" height="31" rx="3"/><text class="k" x="57" y="74">8</text><text class="s" x="60" y="88" fill="#191b31">♠</text>
    <rect class="c" x="68" y="64" width="22" height="31" rx="3"/><text class="k" x="71" y="74">9</text><text class="s" x="74" y="88" fill="#191b31">♠</text>
    <rect class="c" x="82" y="64" width="22" height="31" rx="3"/><text class="k" x="84" y="74">10</text><text class="s" x="88" y="88" fill="#191b31">♠</text>

    <rect class="c" x="108" y="64" width="22" height="31" rx="3"/><text class="r" x="111" y="74">J</text><text class="s" x="114" y="88" fill="#c62828">♥</text>
    <rect class="c" x="122" y="64" width="22" height="31" rx="3"/><text class="r" x="125" y="74">Q</text><text class="s" x="128" y="88" fill="#c62828">♥</text>
    <g class="draw">
      <rect class="c" x="136" y="64" width="22" height="31" rx="3"/><text class="r" x="139" y="74">K</text><text class="s" x="142" y="88" fill="#c62828">♥</text>
    </g>
  </g>

  <!-- Vạch bộ -->
  <rect x="8" y="99" width="46" height="3.5" rx="1.75" fill="#2fd19f"/>
  <rect x="56" y="99" width="46" height="3.5" rx="1.75" fill="#6aa5ff"/>
  <rect class="bar3" x="110" y="99" width="46" height="3.5" rx="1.75" fill="#ff7fb3"/>

  <!-- GIN! -->
  <g class="badge">
    <rect x="94" y="32" width="38" height="20" rx="10" fill="#ffc53d"/>
    <text x="113" y="46.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#2a1d00">GIN!</text>
  </g>
</svg>
