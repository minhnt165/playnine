<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Biểu tượng Kim Tự Tháp: tháp 3 hàng lá bài trên nền nỉ xanh, lá đỉnh viền vàng (lá K) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8460"/>
      <stop offset="1" stop-color="#123d2c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".16" r=".55">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation=".9" flood-color="#06140e" flood-opacity=".55"/>
    </filter>
    <path id="heart" d="M0 3.2C-.4 2.8-4 .2-4-2a2 2 0 0 1 4-.8A2 2 0 0 1 4-2c0 2.2-3.6 4.8-4 5.2z"/>
    <path id="diamond" d="M0-3.6 2.8 0 0 3.6-2.8 0z"/>
    <path id="spade" d="M0-3.8C-.4-3.4-3.4-1.2-3.4.8A1.7 1.7 0 0 0-.6 2.2L-1.1 3.8h2.2L.6 2.2A1.7 1.7 0 0 0 3.4.8C3.4-1.2.4-3.4 0-3.8z"/>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <!-- Đỉnh trước, rồi hàng giữa, hàng dưới đè lên -->
  <g filter="url(#sh)" fill="#fffefb" stroke="#c4c7d4" stroke-width=".8">
    <rect x="24.5" y="8" width="15" height="21" rx="2.4" stroke="#e0a91c" stroke-width="1.8"/>
    <rect x="15.75" y="21" width="15" height="21" rx="2.4"/>
    <rect x="33.25" y="21" width="15" height="21" rx="2.4"/>
    <rect x="7" y="34" width="15" height="21" rx="2.4"/>
    <rect x="24.5" y="34" width="15" height="21" rx="2.4"/>
    <rect x="42" y="34" width="15" height="21" rx="2.4"/>
  </g>
  <use href="#heart" x="32" y="15" fill="#c62828"/>
  <use href="#diamond" x="23.25" y="27.5" fill="#c62828"/>
  <use href="#spade" x="40.75" y="27.5" fill="#191b31"/>
  <use href="#spade" x="14.5" y="44.5" fill="#191b31"/>
  <use href="#heart" x="32" y="44.5" fill="#c62828"/>
  <use href="#diamond" x="49.5" y="44.5" fill="#c62828"/>
</svg>
