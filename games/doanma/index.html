<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Code Breaker">
  <meta name="description" content="Code Breaker">
  <title>Code Breaker</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var t = JSON.parse(localStorage.getItem('playnine-doanma-settings-v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=3">
  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>
  <!-- Ký hiệu riêng của từng màu: phân biệt chốt mà không cần nhìn màu -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="sym-0" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z"/></symbol>
    <symbol id="sym-1" viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></symbol>
    <symbol id="sym-2" viewBox="0 0 24 24"><path d="m12 2.6 2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9l-5.8 3.2 1.4-6.4-4.9-4.4 6.5-.7z"/></symbol>
    <symbol id="sym-3" viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/></symbol>
    <symbol id="sym-4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></symbol>
    <symbol id="sym-5" viewBox="0 0 24 24"><path d="M9.3 3.5h5.4v5.8h5.8v5.4h-5.8v5.8H9.3v-5.8H3.5V9.3h5.8z"/></symbol>
    <symbol id="sym-6" viewBox="0 0 24 24"><path d="M12 21 3.9 13A5 5 0 0 1 12 6.4 5 5 0 0 1 20.1 13z"/></symbol>
    <symbol id="sym-7" viewBox="0 0 24 24"><path d="M14.5 2.8a9.3 9.3 0 1 0 6.8 14.1A7.6 7.6 0 0 1 14.5 2.8z"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">Code Breaker</h1>
        <span class="badge" id="mode-badge"></span>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <button class="btn-icon" id="btn-new" type="button" data-i18n-attr="aria-label:kit.newGame;title:kit.newGame">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
        </button>
      </div>
    </header>

    <div class="hud">
      <div class="hud-box"><div class="hud-label" data-i18n="hud.time">Time</div><div class="hud-value" id="time">0:00.0</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.left">Guesses left</div><div class="hud-value" id="left">10</div></div>
      <div class="hud-box"><div class="hud-label" id="best-label">Best</div><div class="hud-value" id="best">–</div></div>
    </div>

    <main class="stage">
      <div class="play">
        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board">
            <div class="row secret-row" id="secret-row"></div>
            <ol class="rows" id="rows" data-i18n-attr="aria-label:board.label"></ol>
          </div>
        </div>
        <div class="controls">
          <div class="palette" id="palette" role="group" data-i18n-attr="aria-label:board.palette"></div>
          <div class="actions">
            <button class="btn btn-ghost btn-back" id="btn-back" type="button" data-i18n-attr="aria-label:board.back;title:board.back">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H8.4L2 12l6.4 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zm-3.3 10.3-1.4 1.4L13.6 14l-2.7 2.7-1.4-1.4 2.7-2.7-2.7-2.7 1.4-1.4 2.7 2.7 2.7-2.7 1.4 1.4-2.7 2.7z"/></svg>
            </button>
            <button class="btn btn-primary btn-submit" id="btn-submit" type="button" data-i18n="board.submit">Check</button>
          </div>
        </div>
      </div>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>

    <p class="help"><span class="help-keys" id="help-keys"></span><span class="help-touch" data-i18n="help.touch"></span></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Kết thúc ván (thắng hoặc hết lượt) -->
  <div class="modal" id="modal-end" hidden>
    <div class="modal-backdrop" data-close="modal-end"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="end-title">
      <h2 id="end-title"></h2>
      <p class="modal-text" id="end-text"></p>
      <div class="end-code" id="end-code"></div>
      <p class="modal-text end-best" id="end-best" hidden data-i18n="end.best">New best time!</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-end" data-i18n="kit.close">Close</button>
        <button class="btn btn-primary" id="btn-again" type="button" data-i18n="kit.playAgain">Play again</button>
      </div>
    </div>
  </div>

  <!-- Bỏ ván đang chơi -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-backdrop" data-close="modal-confirm"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="confirm.title">Start a new game?</h2>
      <p class="modal-text" data-i18n="confirm.text">This game will count as a loss.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-confirm" data-i18n="kit.cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-new" type="button" data-i18n="kit.newGame">New game</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <p class="modal-text" data-i18n="help.text"></p>
      <ul class="legend">
        <li><span class="pins legend-pins"><i class="pin black"></i></span><span data-i18n-html="help.black"></span></li>
        <li><span class="pins legend-pins"><i class="pin white"></i></span><span data-i18n-html="help.white"></span></li>
      </ul>
      <p class="modal-text" id="help-mode"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid">
        <div><dt data-i18n="stats.played">Played</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.won">Cracked</dt><dd id="stats-won">0</dd></div>
        <div><dt data-i18n="stats.bestEasy">Best · Easy</dt><dd id="stats-best-easy">–</dd></div>
        <div><dt data-i18n="stats.bestHard">Best · Hard</dt><dd id="stats-best-hard">–</dd></div>
      </dl>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-name" data-i18n="settings.mode">Difficulty</span>
          <div class="segmented" data-setting="mode">
            <button type="button" data-value="easy" data-i18n="mode.easy">Easy</button>
            <button type="button" data-value="hard" data-i18n="mode.hard">Hard</button>
          </div>
          <span class="setting-desc" id="mode-desc"></span>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.1"></script>
</body>
</html>
