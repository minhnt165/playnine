<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tre cuộn sang trái, chim vỗ cánh lách qua khe; tự chứa, hoạt hình bằng CSS,
       tắt khi người dùng giảm chuyển động. Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt. -->
  <style>
    .scroll { animation: scroll 4.8s linear infinite; }
    .ground { animation: ground .84s linear infinite; }
    .bird { animation: fly 4.8s linear infinite; }
    .wing { animation: wing .3s ease-in-out infinite alternate; transform-origin: -3px 1px; transform-box: view-box; }
    @keyframes scroll { to { transform: translateX(-160px); } }
    @keyframes ground { to { transform: translateX(-28px); } }
    @keyframes fly {
      0% { transform: translate(50px, 50px) rotate(-10deg); }
      10% { transform: translate(50px, 43px) rotate(-18deg); }
      24% { transform: translate(50px, 53px) rotate(14deg); }
      32% { transform: translate(50px, 47px) rotate(-16deg); }
      44% { transform: translate(50px, 66px) rotate(24deg); }
      52% { transform: translate(50px, 70px) rotate(-12deg); }
      62% { transform: translate(50px, 64px) rotate(-18deg); }
      74% { transform: translate(50px, 72px) rotate(16deg); }
      84% { transform: translate(50px, 62px) rotate(-20deg); }
      92% { transform: translate(50px, 47px) rotate(-14deg); }
      100% { transform: translate(50px, 50px) rotate(-10deg); }
    }
    @keyframes wing { to { transform: rotate(-40deg); } }
    @media (prefers-reduced-motion: reduce) {
      .scroll, .ground, .bird, .wing { animation: none; }
      .bird { transform: translate(50px, 50px) rotate(-10deg); }
    }
  </style>
  <defs>
    <linearGradient id="bam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7a22"/>
      <stop offset=".35" stop-color="#b5e27c"/>
      <stop offset=".6" stop-color="#6cb23f"/>
      <stop offset="1" stop-color="#3f7a22"/>
    </linearGradient>
    <!-- Một cặp tre: khe 34 đơn vị, tâm khe ở y = 0 -->
    <g id="pair">
      <rect x="0" y="-140" width="18" height="123" fill="url(#bam)"/>
      <rect x="-1" y="-48" width="20" height="2.5" fill="#2f6418"/>
      <rect x="-1.5" y="-21" width="21" height="4" fill="#2f6418"/>
      <ellipse cx="24" cy="-46" rx="7" ry="2.2" fill="#4f9d2c" transform="rotate(-25 18 -46)"/>
      <rect x="0" y="17" width="18" height="120" fill="url(#bam)"/>
      <rect x="-1.5" y="17" width="21" height="4" fill="#2f6418"/>
      <rect x="-1" y="46" width="20" height="2.5" fill="#2f6418"/>
    </g>
  </defs>
  <!-- Mây -->
  <g fill="#fff" opacity=".22">
    <circle cx="118" cy="20" r="7"/><circle cx="127" cy="16" r="9"/><circle cx="137" cy="21" r="6"/>
    <circle cx="20" cy="30" r="5"/><circle cx="27" cy="27" r="7"/><circle cx="35" cy="31" r="4.5"/>
  </g>
  <!-- Tre cuộn: chu kỳ 160 (hai cặp khe khác nhau lặp lại) -->
  <g class="scroll">
    <use href="#pair" x="41" y="50"/>
    <use href="#pair" x="121" y="70"/>
    <use href="#pair" x="201" y="50"/>
    <use href="#pair" x="281" y="70"/>
  </g>
  <!-- Mặt đất -->
  <rect x="0" y="104" width="160" height="16" fill="#e4c48c"/>
  <rect x="0" y="104" width="160" height="7" fill="#7cc95b"/>
  <g class="ground" fill="#5aa63f">
    <path d="M0 105h6l-3 6h-6zM28 105h6l-3 6h-6zM56 105h6l-3 6h-6zM84 105h6l-3 6h-6zM112 105h6l-3 6h-6zM140 105h6l-3 6h-6zM168 105h6l-3 6h-6z"/>
  </g>
  <rect x="0" y="103" width="160" height="1.5" fill="#5aa63f"/>
  <!-- Chim -->
  <g class="bird" transform="translate(50 50) rotate(-10)">
    <path d="M-6-1.5-11.5-5-10.5-.5-12 3-5.5 2.5z" fill="#f08a24"/>
    <circle r="7.5" fill="#ffcd3c" stroke="#d9871c" stroke-width="1.1"/>
    <ellipse cx="1.5" cy="3.2" rx="4.8" ry="3.2" fill="#fff3cc"/>
    <circle cx="3.4" cy="-2.4" r="2.6" fill="#fff"/>
    <circle cx="4.1" cy="-2.4" r="1.3" fill="#1d1b2e"/>
    <path d="M6-1.5q6 1 .5 2.8z" fill="#ff8a2a"/>
    <ellipse class="wing" cx="-3" cy="1" rx="4.5" ry="3" fill="#f7a928" stroke="#d9871c" stroke-width=".8"/>
  </g>
</svg>
