<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lights Out">
  <meta name="description" content="Lights Out">
  <title>Lights Out</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var t = JSON.parse(localStorage.getItem('playnine-tatden-settings-v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=3">
  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">Lights Out</h1>
        <button class="badge size-badge" id="btn-size" type="button">5x5</button>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
      </div>
    </header>

    <div class="hud">
      <div class="hud-box"><div class="hud-label" data-i18n="hud.level">Level</div><div class="hud-value" id="level">1</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.moves">Moves</div><div class="hud-value" id="moves">0</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.par">Par</div><div class="hud-value" id="par">–</div></div>
    </div>

    <main class="stage">
      <div class="board" id="board" role="group"></div>
    </main>

    <div class="controls">
      <button class="btn btn-ghost" id="btn-restart" type="button" data-i18n-attr="title:btn.restartLong">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        <span data-i18n="btn.restart">Restart</span>
      </button>
      <button class="btn btn-primary" id="btn-new" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1 1 0 0 1 1 1v1.1a7 7 0 0 1 4.9 11.4l-.9 1.1V19a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-2.4l-.9-1.1A7 7 0 0 1 11 4.1V3a1 1 0 0 1 1-1zm-2 17h4v-1h-4v1z"/></svg>
        <span data-i18n="btn.new">New board</span>
      </button>
    </div>

    <p class="help"><span class="help-keys" data-i18n-html="help.keys"></span><span class="help-touch" data-i18n="help.touch"></span></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Thắng -->
  <div class="modal" id="modal-win" hidden>
    <div class="modal-backdrop" data-close="modal-win"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title" data-i18n="win.title">Lights out!</h2>
      <p class="win-score" id="win-text"></p>
      <p class="win-badge" id="win-badge"></p>
      <p class="modal-text" id="win-next"></p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-next" type="button" data-i18n="win.btn">Next board</button>
      </div>
    </div>
  </div>

  <!-- Bỏ bàn đang chơi (bàn mới hoặc đổi cỡ bàn) -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-backdrop" data-close="modal-confirm"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="confirm.title">Leave this board?</h2>
      <p class="modal-text" data-i18n="confirm.text">Leaving it counts as a loss.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-confirm" data-i18n="kit.cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm" type="button">New board</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <svg class="help-art" viewBox="0 0 150 54" aria-hidden="true">
        <g class="ha-off"><rect x="2" y="2" width="14" height="14" rx="4"/><rect x="20" y="2" width="14" height="14" rx="4"/><rect x="38" y="2" width="14" height="14" rx="4"/><rect x="2" y="38" width="14" height="14" rx="4"/><rect x="38" y="38" width="14" height="14" rx="4"/><rect x="2" y="20" width="14" height="14" rx="4"/><rect x="38" y="20" width="14" height="14" rx="4"/><rect x="20" y="20" width="14" height="14" rx="4"/><rect x="20" y="38" width="14" height="14" rx="4"/></g>
        <g class="ha-on"><rect x="20" y="20" width="14" height="14" rx="4"/></g>
        <circle class="ha-dot" cx="27" cy="27" r="3"/>
        <path class="ha-arrow" d="M64 27h20m-6-6 6 6-6 6"/>
        <g class="ha-off"><rect x="98" y="2" width="14" height="14" rx="4"/><rect x="134" y="2" width="14" height="14" rx="4"/><rect x="98" y="38" width="14" height="14" rx="4"/><rect x="134" y="38" width="14" height="14" rx="4"/></g>
        <g class="ha-on"><rect x="116" y="2" width="14" height="14" rx="4"/><rect x="98" y="20" width="14" height="14" rx="4"/><rect x="134" y="20" width="14" height="14" rx="4"/><rect x="116" y="38" width="14" height="14" rx="4"/></g>
        <g class="ha-off"><rect x="116" y="20" width="14" height="14" rx="4"/></g>
      </svg>
      <p class="modal-text" data-i18n="help.rules"></p>
      <p class="modal-text" data-i18n="help.par"></p>
      <p class="modal-text" data-i18n="help.levels"></p>
      <p class="modal-text" data-i18n="help.tip"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid">
        <div><dt data-i18n="stats.played">Played</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.won">Solved</dt><dd id="stats-won">0</dd></div>
        <div><dt data-i18n="stats.par">On par or better</dt><dd id="stats-par">0</dd></div>
        <div><dt data-i18n="stats.streak">Win streak</dt><dd id="stats-streak">0</dd></div>
        <div><dt id="stats-level5-label">Level 5x5</dt><dd id="stats-level5">1</dd></div>
        <div><dt id="stats-level7-label">Level 7x7</dt><dd id="stats-level7">1</dd></div>
      </dl>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-text"><span class="setting-name" data-i18n="size.name">Board size</span><span class="setting-desc" data-i18n="size.desc"></span></span>
          <div class="segmented" data-setting="size">
            <button type="button" data-value="5x5">5x5</button>
            <button type="button" data-value="7x7">7x7</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.1"></script>
</body>
</html>
