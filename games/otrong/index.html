<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FreeCell">
  <meta name="description" content="FreeCell solitaire: the classic deals #1 to #32000, four free cells, drag or tap to move, unlimited undo, hints from a solver, statistics and autosave.">
  <title>FreeCell</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối và bài 4 màu đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var st = JSON.parse(localStorage.getItem('playnine-otrong-settings-v1') || '{}');
      if (st.theme === 'light' || st.theme === 'dark') document.documentElement.setAttribute('data-theme', st.theme);
      if (st.fourColor === true) document.documentElement.classList.add('cards-4color');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=2">
  <link rel="stylesheet" href="../_kit/cards.css?v=1">
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">FreeCell</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-settings" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <button class="btn-icon" id="btn-new" type="button" data-i18n-attr="aria-label:kit.newGame;title:kit.newGame">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
        </button>
      </div>
    </header>

    <div class="hud">
      <div class="hud-box"><div class="hud-label" data-i18n="hud.time">Time</div><div class="hud-value" id="time">0:00</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.moves">Moves</div><div class="hud-value" id="moves">0</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.deal">Deal</div><div class="hud-value" id="deal">#1</div></div>
    </div>

    <main class="stage" id="table-wrap">
      <div class="table" id="table" role="group" data-i18n-attr="aria-label:table.label"></div>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>

    <div class="tools" role="group" data-i18n-attr="aria-label:tools.label">
      <button class="tool" id="btn-undo" type="button" data-i18n-attr="title:btn.undoKey">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        <span data-i18n="btn.undo">Undo</span>
      </button>
      <button class="tool" id="btn-hint" type="button" data-i18n-attr="title:btn.hintKey">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6v-1.5H9V21zm3-19a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2zm2.85 11.1-.85.6V16h-4v-2.3l-.85-.6a5 5 0 1 1 5.7 0z"/></svg>
        <span id="hint-label" data-i18n="btn.hint">Hint</span>
      </button>
      <button class="tool tool-primary" id="btn-finish" type="button" data-i18n-attr="title:btn.finishKey" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        <span data-i18n="btn.finish">Finish</span>
      </button>
    </div>

    <p class="help"><span class="help-keys" data-i18n-html="help.keys"></span><span class="help-touch" data-i18n="help.touch"></span></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Thắng -->
  <div class="modal" id="modal-win" hidden>
    <div class="modal-backdrop" data-close="modal-win"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title" data-i18n="win.title">Solved!</h2>
      <dl class="stat-grid win-grid">
        <div><dt data-i18n="win.time">Time</dt><dd id="win-time">0:00</dd></div>
        <div><dt data-i18n="win.moves">Moves</dt><dd id="win-moves">0</dd></div>
        <div><dt data-i18n="win.deal">Deal</dt><dd id="win-deal">#1</dd></div>
      </dl>
      <p class="modal-text win-best" id="win-best" hidden data-i18n="win.best">New best time!</p>
      <p class="modal-text" id="win-assisted" hidden data-i18n="win.assisted">Solved with hints.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-win" data-i18n="kit.close">Close</button>
        <button class="btn btn-primary" id="btn-again" type="button" data-i18n="kit.newGame">New game</button>
      </div>
    </div>
  </div>

  <!-- Bỏ ván đang chơi -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-backdrop" data-close="modal-confirm"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="confirm.title">Abandon this game?</h2>
      <p class="modal-text" data-i18n="confirm.text">This deal will count as a loss.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-confirm" data-i18n="kit.cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-new" type="button" data-i18n="kit.newGame">New game</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card modal-help" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <div class="help-body" data-i18n-html="help.html"></div>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid stat-grid-3">
        <div><dt data-i18n="stats.played">Played</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.won">Solved</dt><dd id="stats-won">0</dd></div>
        <div><dt data-i18n="stats.rate">Win rate</dt><dd id="stats-rate">0%</dd></div>
        <div><dt data-i18n="stats.best">Best time</dt><dd id="stats-best">–</dd></div>
        <div><dt data-i18n="stats.streak">Streak</dt><dd id="stats-streak">0</dd></div>
        <div><dt data-i18n="stats.bestStreak">Best streak</dt><dd id="stats-best-streak">0</dd></div>
      </dl>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-text"><span class="setting-name" data-i18n="set.auto">Auto-move to foundations</span><span class="setting-desc" data-i18n="set.autoDesc"></span></span>
          <input class="switch" type="checkbox" data-setting="auto">
        </label>
        <label class="setting-row">
          <span class="setting-text"><span class="setting-name" data-i18n="set.fourColor">Four-colour deck</span><span class="setting-desc" data-i18n="set.fourColorDesc"></span></span>
          <input class="switch" type="checkbox" data-setting="fourColor">
        </label>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
        <form class="setting deal-form" id="deal-form" novalidate>
          <label class="setting-text" for="deal-input"><span class="setting-name" data-i18n="set.deal">Play a deal by number</span><span class="setting-desc" data-i18n="set.dealDesc"></span></label>
          <div class="deal-row">
            <input class="deal-input" id="deal-input" type="number" inputmode="numeric" min="1" max="32000" step="1" placeholder="1–32000" autocomplete="off">
            <button class="btn btn-ghost" type="submit" data-i18n="set.dealPlay">Play</button>
          </div>
          <span class="deal-error" id="deal-error" role="alert" hidden data-i18n="set.dealBad"></span>
        </form>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="../_kit/cards.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
