  <!-- Ảnh xem trước Ô Trống (FreeCell): 4 ô trống, 4 ô đích, 8 cột; 7♥ vào ô trống, A♠ rồi 2♠ lên đích.
       Tự chứa, hoạt hình bằng CSS, tắt khi giảm chuyển động; nền lấy từ preview.bg trong game.json. -->
  <style>
    .slot{fill:#fff;fill-opacity:.06;stroke:#fff;stroke-opacity:.38;stroke-width:1.6;stroke-dasharray:5 4}
    .ghost{fill:#fff;fill-opacity:.25}
