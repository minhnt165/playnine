    @keyframes m2{0%,30%{transform:translate(0,0);opacity:1}44%,90%{transform:translate(96px,-136px);opacity:1}95%{transform:translate(96px,-136px);opacity:0}96%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:1}}
    @keyframes m3{0%,52%{transform:translate(0,0);opacity:1}66%,90%{transform:translate(-48px,-136px);opacity:1}95%{transform:translate(-48px,-136px);opacity:0}96%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:1}}
    @media (prefers-reduced-motion: reduce){.m1,.m2,.m3{animation:none}}
  </style>
