<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: bàn pinball thu nhỏ, bi rơi xuống flipper phải, bị đánh lên trúng hành tinh.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động. Nền ô xem trước lấy từ preview.bg trong game.json. -->
  <style>
    .ball { animation: ball 2.4s linear infinite; }
    .flip-r { transform-origin: 101px 101px; animation: flip 2.4s linear infinite; }
    .glow { opacity: 0; animation: glow 2.4s linear infinite; }
    .lamp { animation: lamp 1.2s steps(1) infinite; }
    .lamp2 { animation-delay: .4s; }
    .lamp3 { animation-delay: .8s; }
    @keyframes ball {
      0% { transform: translate(96px, 58px); animation-timing-function: ease-in; }
      42% { transform: translate(89px, 93px); }
      50% { transform: translate(87px, 94px); animation-timing-function: ease-out; }
      68% { transform: translate(68px, 50px); animation-timing-function: ease-in-out; }
      84% { transform: translate(82px, 40px); }
      100% { transform: translate(96px, 58px); }
    }
    @keyframes flip { 0%, 44% { transform: rotate(0deg); } 50% { transform: rotate(48deg); } 62%, 100% { transform: rotate(0deg); } }
    @keyframes glow { 0%, 66% { opacity: 0; } 70% { opacity: .9; } 84%, 100% { opacity: 0; } }
    @keyframes lamp { 0% { fill: #ffb020; } 33% { fill: #3a2f6e; } }
    @media (prefers-reduced-motion: reduce) {
      .ball, .flip-r, .glow, .lamp { animation: none; }
      .ball { transform: translate(84px, 72px); }
    }
  </style>
  <!-- khung bàn -->
  <path d="M38 118V40a42 34 0 0 1 84 0v78" fill="rgba(20,14,60,.55)" stroke="#a48bff" stroke-width="3"/>
  <path d="M116 118V46" stroke="#a48bff" stroke-width="2"/>
  <!-- làn U F O -->
  <circle class="lamp" cx="68" cy="22" r="3" fill="#3a2f6e"/>
  <circle class="lamp lamp2" cx="80" cy="22" r="3" fill="#3a2f6e"/>
  <circle class="lamp lamp3" cx="92" cy="22" r="3" fill="#3a2f6e"/>
  <!-- hành tinh -->
  <circle class="glow" cx="68" cy="44" r="13" fill="#ffb020"/>
  <circle cx="68" cy="44" r="7.5" fill="#ff5fa8"/>
  <circle cx="68" cy="44" r="5.5" fill="#ff9f43"/>
  <circle cx="94" cy="46" r="7.5" fill="#ff5fa8"/>
  <circle cx="94" cy="46" r="5.5" fill="#2ee6c5"/>
  <ellipse cx="94" cy="46" rx="10" ry="2.8" fill="none" stroke="#ffd166" stroke-width="1.4" transform="rotate(-20 94 46)"/>
  <circle cx="81" cy="62" r="7.5" fill="#ff5fa8"/>
  <circle cx="81" cy="62" r="5.5" fill="#e2459a"/>
  <!-- slingshot -->
  <path d="M50 78v14l9 5z" fill="#ffd166" stroke="#ff5fa8" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M110 78v14l-9 5z" fill="#ffd166" stroke="#ff5fa8" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- ray + flipper -->
  <path d="M44 86v10l13 7M116 86v10l-13 7" fill="none" stroke="#a48bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M57 99.5a3 3 0 0 1 3.6-1.4l15 6.4a1.6 1.6 0 0 1-1 3l-15.6-3.6a3 3 0 0 1-2-4.4z" fill="#ffffff" stroke="#ff5fa8" stroke-width="1.4"/>
  <g class="flip-r">
    <path d="M103.6 99.5a3 3 0 0 0-3.6-1.4l-15 6.4a1.6 1.6 0 0 0 1 3l15.6-3.6a3 3 0 0 0 2-4.4z" fill="#ffffff" stroke="#ff5fa8" stroke-width="1.4"/>
  </g>
  <!-- bi -->
  <g class="ball">
    <circle r="3.6" fill="#d9dcef"/>
    <circle cx="-1.1" cy="-1.2" r="1.3" fill="#ffffff"/>
  </g>
  <!-- bi chờ trên lò xo -->
  <circle cx="119" cy="110" r="2.2" fill="#d9dcef"/>
</svg>
