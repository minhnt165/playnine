<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2391"/>
      <stop offset="1" stop-color="#0d0a2a"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#cfd3ea"/>
      <stop offset="1" stop-color="#7d84a8"/>
    </radialGradient>
    <radialGradient id="planet" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#2ee6c5"/>
      <stop offset="1" stop-color="#14a08a"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="14" cy="12" r="1.3" fill="#e6e2ff" opacity=".7"/>
  <circle cx="52" cy="40" r="1.1" fill="#e6e2ff" opacity=".6"/>
  <circle cx="9" cy="34" r="1" fill="#e6e2ff" opacity=".5"/>
  <!-- hành tinh (bumper) -->
  <circle cx="20" cy="22" r="9" fill="#ff5fa8"/>
