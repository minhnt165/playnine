  <ellipse cx="20" cy="22" rx="12" ry="3.4" fill="none" stroke="#ffd166" stroke-width="2" transform="rotate(-22 20 22)"/>
  <!-- flipper -->
  <path d="M12.5 44.5a5.5 5.5 0 0 1 7.2-3.6l23.6 9.2a2.9 2.9 0 0 1-1.6 5.6L16.4 51.3a5.5 5.5 0 0 1-3.9-6.8z" fill="#ffffff" stroke="#ff5fa8" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="17.6" cy="46" r="1.8" fill="#ff5fa8"/>
  <!-- bi -->
  <circle cx="44" cy="25" r="10" fill="url(#ball)"/>
  <circle cx="40.8" cy="21.4" r="2.6" fill="#ffffff" opacity=".9"/>
