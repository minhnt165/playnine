<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Quân đỏ: xúc xắc lăn, bước một ô tới chân thang, leo lên, bước sang đầu rắn rồi trượt xuống. -->
  <style>
    .tok { animation: walk 6s ease-in-out infinite; }
    .die { animation: roll 6s ease-in-out infinite; transform-origin: 141px 34px; }
    @keyframes walk {
      0%, 12% { transform: translate(0, 0); opacity: 1; }
      15% { transform: translate(11px, -7px); }
      18%, 24% { transform: translate(22px, 0); }
      38%, 44% { transform: translate(44px, -44px); }
      47% { transform: translate(55px, -51px); }
      50%, 58% { transform: translate(66px, -44px); }
      61% { transform: translate(70px, -34px); }
      64% { transform: translate(72px, -22px); }
      68% { transform: translate(80px, -9px); }
      72%, 88% { transform: translate(88px, 0); opacity: 1; }
      93% { transform: translate(88px, 0); opacity: 0; }
      94% { transform: translate(0, 0); opacity: 0; }
      100% { transform: translate(0, 0); opacity: 1; }
    }
    @keyframes roll {
      0%, 100% { transform: rotate(0); }
      3% { transform: rotate(-18deg) scale(.9); }
      6% { transform: rotate(12deg) scale(1.05); }
      9% { transform: rotate(-6deg); }
      12% { transform: rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) { .tok, .die { animation: none; } }
  </style>
  <!-- Bàn 5x4 -->
  <rect x="9" y="9" width="116" height="94" rx="9" fill="#2a2350"/>
  <g>
    <rect x="12" y="12" width="110" height="88" rx="6" fill="#fdffb6"/>
    <path fill="#caffbf" d="M12 12h22v22H12zM56 12h22v22H56zM100 12h22v22h-22zM34 34h22v22H34zM78 34h22v22H78zM12 56h22v22H12zM56 56h22v22H56zM100 56h22v22h-22zM34 78h22v22H34zM78 78h22v22H78z"/>
    <path fill="#9bf6ff" d="M34 12h22v22H34zM12 34h22v22H12zM78 56h22v22H78zM56 78h22v22H56z"/>
    <path fill="#ffc6ff" d="M78 12h22v22H78zM100 34h22v22h-22zM34 56h22v22H34z"/>
    <rect x="12" y="12" width="22" height="22" fill="#ffd166"/>
    <path d="M17 18h12v3a6 6 0 0 1-12 0zM23 27v3M19.5 30.5h7" fill="none" stroke="#8a5a00" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Thang: chân ô dưới (45,89) lên (67,45) -->
  <g stroke-linecap="round">
    <path d="M40.5 92 61.5 43M49.5 96 70.5 47" stroke="#6b3d17" stroke-width="4"/>
    <path d="M43 85l9 3.5M47 76l9 3.5M51 67l9 3.5M55 58l9 3.5M59 49l9 3.5" stroke="#6b3d17" stroke-width="3.2"/>
    <path d="M40.5 92 61.5 43M49.5 96 70.5 47" stroke="#e2a564" stroke-width="1.8"/>
  </g>
  <!-- Rắn: đầu ở (89,45), đuôi ở (111,89) -->
  <path d="M89 45c10 6-8 14 6 22s4 16 16 22" fill="none" stroke="#1b5e20" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M89 45c10 6-8 14 6 22s4 16 16 22" fill="none" stroke="#43a047" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M90 55l5 2M96 67l-4 3M101 77l4 1" stroke="#c5e1a5" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 37l-1.5-3M88 37l2-2.6" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="88.5" cy="42.5" rx="6" ry="5" fill="#43a047" stroke="#1b5e20" stroke-width="1.6"/>
  <circle cx="86.3" cy="41.3" r="1.7" fill="#fff"/><circle cx="90.7" cy="41.3" r="1.7" fill="#fff"/>
  <circle cx="86.5" cy="41" r=".8" fill="#111"/><circle cx="90.9" cy="41" r=".8" fill="#111"/>
  <!-- Quân xanh đứng yên, quân đỏ đi -->
  <circle cx="111" cy="23" r="6.5" fill="#2563eb" stroke="#fff" stroke-width="1.8"/>
  <g class="tok">
    <circle cx="23" cy="91" r="7" fill="#000" opacity=".2"/>
    <circle cx="23" cy="89" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
    <circle cx="21" cy="87" r="2.2" fill="#fff" opacity=".55"/>
  </g>
  <!-- Xúc xắc -->
  <g class="die">
    <rect x="131" y="24" width="20" height="20" rx="5" fill="#fff" stroke="#ef4444" stroke-width="2.2"/>
    <circle cx="141" cy="34" r="2.2" fill="#241d45"/>
  </g>
</svg>
