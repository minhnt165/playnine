<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: lưới 4x4 chia lồng, các số được điền dần theo đường chéo rồi cả lưới sáng lên khi giải xong.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động; nền trong suốt (nền thẻ lấy từ preview.bg). -->
  <style>
    .d { opacity: 0; animation: fill 9s ease-out infinite; }
    .glow { opacity: 0; animation: glow 9s ease-in-out infinite; animation-delay: 4.3s; }
    @keyframes fill { 0% { opacity: 0; transform: translateY(2px); } 3%, 62% { opacity: 1; transform: none; } 66%, 100% { opacity: 0; } }
    @keyframes glow { 0% { opacity: 0; } 4%, 10% { opacity: 1; } 18%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .d, .glow { animation: none; }
      .d { opacity: 1; }
    }
    text { font-family: system-ui, "Segoe UI", sans-serif; font-weight: 700; }
    .lab text { font-size: 6px; fill: #2b2f55; }
    .num text { font-size: 15px; fill: #6a4cf5; text-anchor: middle; }
    .num .g { fill: #14162b; font-weight: 800; }
  </style>
  <rect class="glow" x="29" y="5" width="110" height="110" rx="9" fill="none" stroke="#b9a6ff" stroke-width="3"/>
  <rect x="34" y="10" width="100" height="100" rx="4" fill="#fbfaff"/>
  <path d="M59 10v25M59 35h25M109 10v25M84 35h25M109 60h25M34 85h25M84 60v25M59 85v25M109 85v25" stroke="#d6d9ee" stroke-width=".8" fill="none"/>
  <path d="M34 35h25M84 10v25M109 35h25M59 35v25M34 60h25M84 35v25M59 60h25M109 35v25M84 60h25M59 60v25M59 85h25M109 60v25M84 85h25M109 85h25M84 85v25" stroke="#2b2f55" stroke-width="2.2" stroke-linecap="square" fill="none"/>
  <rect x="34" y="10" width="100" height="100" rx="4" fill="none" stroke="#2b2f55" stroke-width="2.4"/>
  <g class="lab"><text x="36.5" y="17.5">7+</text><text x="111.5" y="42.5">5+</text><text x="61.5" y="67.5">3−</text><text x="86.5" y="92.5">2÷</text><text x="36.5" y="67.5">9+</text><text x="86.5" y="17.5">12×</text><text x="36.5" y="42.5">3</text></g>
  <g class="num"><text class="g" x="46.5" y="54">3</text><text class="d" style="animation-delay:0.00s" x="46.5" y="29">1</text><text class="d" style="animation-delay:0.28s" x="71.5" y="29">2</text><text class="d" style="animation-delay:0.56s" x="96.5" y="29">3</text><text class="d" style="animation-delay:0.84s" x="71.5" y="54">4</text><text class="d" style="animation-delay:1.12s" x="46.5" y="79">2</text><text class="d" style="animation-delay:1.40s" x="121.5" y="29">4</text><text class="d" style="animation-delay:1.68s" x="96.5" y="54">1</text><text class="d" style="animation-delay:1.96s" x="71.5" y="79">1</text><text class="d" style="animation-delay:2.24s" x="46.5" y="104">4</text><text class="d" style="animation-delay:2.52s" x="121.5" y="54">2</text><text class="d" style="animation-delay:2.80s" x="96.5" y="79">4</text><text class="d" style="animation-delay:3.08s" x="71.5" y="104">3</text><text class="d" style="animation-delay:3.36s" x="121.5" y="79">3</text><text class="d" style="animation-delay:3.64s" x="96.5" y="104">2</text><text class="d" style="animation-delay:3.92s" x="121.5" y="104">1</text></g>
</svg>
