<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#3a2696"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Lưới 2x2 kiểu giấy: lồng trên "7+" (4, 3), lồng dưới "2÷" (1, 2) -->
  <rect x="9" y="9" width="46" height="46" rx="6" fill="#fbfaff"/>
  <path d="M32 9v46" stroke="#cfcaf0" stroke-width="1.6"/>
  <path d="M9 32h46" stroke="#2b2f55" stroke-width="4"/>
  <rect x="9" y="9" width="46" height="46" rx="6" fill="none" stroke="#2b2f55" stroke-width="3.5"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif" font-weight="800" fill="#2b2f55" font-size="7">
    <text x="12.5" y="17">7+</text>
    <text x="12.5" y="40">2÷</text>
  </g>
  <g font-family="system-ui, 'Segoe UI', sans-serif" font-weight="800" fill="#6a4cf5" font-size="15" text-anchor="middle">
    <text x="23" y="30">4</text>
    <text x="43.5" y="30">3</text>
    <text x="23" y="53">1</text>
    <text x="43.5" y="53">2</text>
  </g>
</svg>
