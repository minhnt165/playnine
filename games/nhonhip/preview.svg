<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Máy phát đỏ → xanh → vàng (mỗi ô sáng 0,5 giây), rồi ngón tay bấm lại đúng thứ tự. -->
  <style>
    .lit { opacity: 0; animation: 5s linear infinite; }
    .lr { animation-name: lr; }
    .lb { animation-name: lb; }
    .ly { animation-name: ly; }
    @keyframes lr { 0%, 10% { opacity: 1; } 10.1%, 49.9% { opacity: 0; } 50%, 58% { opacity: 1; } 58.1%, 100% { opacity: 0; } }
    @keyframes lb { 0%, 13.9% { opacity: 0; } 14%, 24% { opacity: 1; } 24.1%, 61.9% { opacity: 0; } 62%, 70% { opacity: 1; } 70.1%, 100% { opacity: 0; } }
    @keyframes ly { 0%, 27.9% { opacity: 0; } 28%, 38% { opacity: 1; } 38.1%, 73.9% { opacity: 0; } 74%, 82% { opacity: 1; } 82.1%, 100% { opacity: 0; } }
    .finger { opacity: 0; animation: finger 5s ease-in-out infinite; }
    @keyframes finger {
      0%, 44% { opacity: 0; transform: translate(118px, 56px); }
      48%, 52% { opacity: 1; transform: translate(104px, 42px); }
      60%, 64% { opacity: 1; transform: translate(104px, 86px); }
      72%, 78% { opacity: 1; transform: translate(60px, 86px); }
      86%, 100% { opacity: 0; transform: translate(60px, 100px); }
    }
    .dot { opacity: 0.25; animation: 5s linear infinite; }
    .d1 { animation-name: d1; }
    .d2 { animation-name: d2; }
    .d3 { animation-name: d3; }
    @keyframes d1 { 0%, 49% { opacity: 0.25; } 50%, 100% { opacity: 1; } }
    @keyframes d2 { 0%, 61% { opacity: 0.25; } 62%, 100% { opacity: 1; } }
    @keyframes d3 { 0%, 73% { opacity: 0.25; } 74%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .lit, .finger, .dot { animation: none; }
      .lr { opacity: 1; }
    }
  </style>
  <!-- Bàn tròn -->
  <circle cx="80" cy="60" r="51" fill="#0b0d1f"/>
  <circle cx="80" cy="60" r="51" fill="none" stroke="#2c3360" stroke-width="2"/>
  <path d="M76 56H34A42 42 0 0 1 76 14Z" fill="#15803d"/>
  <path d="M84 56V14A42 42 0 0 1 126 56Z" fill="#b91c1c"/>
  <path d="M76 64v42A42 42 0 0 1 34 64Z" fill="#a16207"/>
  <path d="M84 64h42A42 42 0 0 1 84 106Z" fill="#1d4ed8"/>
  <!-- Lớp sáng -->
  <path class="lit lr" d="M84 56V14A42 42 0 0 1 126 56Z" fill="#f87171" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="lit lb" d="M84 64h42A42 42 0 0 1 84 106Z" fill="#60a5fa" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="lit ly" d="M76 64v42A42 42 0 0 1 34 64Z" fill="#fde047" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hình trên từng ô (cho người mù màu) -->
  <g fill="#fff" fill-opacity="0.85">
    <circle cx="57" cy="37" r="7"/>
    <path d="M103 29l8.5 15h-17z"/>
    <path d="M57 74l2.4 5 5.4.6-4 3.7 1.1 5.4L57 86l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/>
    <rect x="96.5" y="76.5" width="13" height="13" rx="2"/>
  </g>
  <!-- Nút giữa: chuỗi 3 bước, chấm sáng dần khi bấm lại -->
  <circle cx="80" cy="60" r="12" fill="#0b0d1f" stroke="#2c3360" stroke-width="2"/>
  <circle class="dot d1" cx="74" cy="60" r="2.4" fill="#8b6cff"/>
  <circle class="dot d2" cx="80" cy="60" r="2.4" fill="#8b6cff"/>
  <circle class="dot d3" cx="86" cy="60" r="2.4" fill="#8b6cff"/>
  <!-- Ngón tay bấm lại -->
  <g class="finger">
    <circle r="9" fill="#fff" fill-opacity="0.25"/>
    <circle r="5" fill="#fff" stroke="#1b1f3b" stroke-width="1.5"/>
  </g>
</svg>
