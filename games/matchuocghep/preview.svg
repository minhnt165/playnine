<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: bàn mạt chược xếp chồng, cặp rồng đỏ tự do sáng viền rồi được gỡ.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động. Nền lấy từ preview.bg trong game.json. -->
  <style>
    .pick { animation: pick 3.2s ease-in-out infinite; }
    .ring { fill: none; stroke: #34d399; stroke-width: 2.6; opacity: 0; animation: ring 3.2s ease-in-out infinite; }
    .b { animation-delay: .35s; }
    @keyframes ring { 0%, 12% { opacity: 0; } 18%, 44% { opacity: 1; } 52%, 100% { opacity: 0; } }
    @keyframes pick { 0%, 44% { opacity: 1; transform: none; } 56% { opacity: 0; transform: translate(-3px, -9px); } 88% { opacity: 0; transform: translate(-3px, -9px); } 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .pick, .ring { animation: none; } .ring { opacity: 1; } }
  </style>
  <defs>
    <g id="t">
      <rect x="3" y="3" width="22" height="29" rx="4" fill="#2f8a63"/>
      <rect x="1.5" y="1.5" width="22" height="29" rx="4" fill="#e6d9b8"/>
      <rect width="22" height="29" rx="4" fill="#fbf5e6" stroke="#cdbb8f" stroke-width=".8"/>
    </g>
    <g id="dim"><rect width="22" height="29" rx="4" fill="#3a2a10" opacity=".22"/></g>
    <g id="red"><rect x="5" y="9" width="12" height="10" rx="1.5" fill="none" stroke="#c8262b" stroke-width="2.6"/><path d="M11 4.5V24.5" stroke="#c8262b" stroke-width="2.8" stroke-linecap="round"/></g>
    <g id="dot"><circle cx="11" cy="14.5" r="6.5" fill="#1d4fa8"/><circle cx="11" cy="14.5" r="3.6" fill="none" stroke="#fff" stroke-width="1.3"/></g>
    <g id="bam"><rect x="6" y="5" width="3.6" height="19" rx="1.8" fill="#17803d"/><rect x="12.4" y="5" width="3.6" height="19" rx="1.8" fill="#17803d"/></g>
    <g id="grn"><path d="M11 4L19 14.5L11 25L3 14.5Z" fill="#17803d"/><path d="M11 9.5L15 14.5L11 19.5L7 14.5Z" fill="none" stroke="#fff" stroke-width="1.4"/></g>
    <g id="wht"><rect x="4" y="4" width="14" height="21" rx="2" fill="none" stroke="#1d4fa8" stroke-width="2"/></g>
  </defs>
  <!-- Tầng 0: hai hàng năm quân -->
  <g transform="translate(26 30)">
    <g class="pick a"><use href="#t"/><use href="#red"/></g>
    <g transform="translate(22 0)"><use href="#t"/><use href="#dot"/><use href="#dim"/></g>
    <g transform="translate(44 0)"><use href="#t"/><use href="#bam"/><use href="#dim"/></g>
    <g transform="translate(66 0)"><use href="#t"/><use href="#grn"/><use href="#dim"/></g>
    <g transform="translate(88 0)"><use href="#t"/><use href="#wht"/></g>
  </g>
  <g transform="translate(26 59)">
    <g><use href="#t"/><use href="#grn"/></g>
    <g transform="translate(22 0)"><use href="#t"/><use href="#wht"/><use href="#dim"/></g>
    <g transform="translate(44 0)"><use href="#t"/><use href="#dot"/><use href="#dim"/></g>
    <g transform="translate(66 0)"><use href="#t"/><use href="#bam"/><use href="#dim"/></g>
    <g transform="translate(88 0)"><g class="pick b"><use href="#t"/><use href="#red"/></g></g>
  </g>
  <!-- Tầng 1: hai quân lệch nửa hàng, đè lên giữa -->
  <g transform="translate(55 41)"><use href="#t"/><use href="#dot"/></g>
  <g transform="translate(77 41)"><use href="#t"/><use href="#bam"/></g>
  <!-- Viền chọn của cặp gỡ được -->
  <rect class="ring" x="23.5" y="27.5" width="27" height="34" rx="6"/>
  <rect class="ring b" x="111.5" y="56.5" width="27" height="34" rx="6"/>
</svg>
