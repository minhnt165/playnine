<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: bàn khúc côn cầu nằm ngang, chày đỏ (bạn) bên trái, chày xanh (máy) bên phải,
       đĩa bay qua lại có dội thành bàn. Hoạt hình CSS bên trong file, tắt khi giảm chuyển động. Nền trong suốt. -->
  <style>
    .puck { animation: puck 2.6s linear infinite; }
    .t1 { animation: puck 2.6s linear infinite; animation-delay: -2.54s; opacity: .45; }
    .t2 { animation: puck 2.6s linear infinite; animation-delay: -2.48s; opacity: .22; }
    .you { animation: you 2.6s ease-in-out infinite; }
    .cpu { animation: cpu 2.6s ease-in-out infinite; }
    @keyframes puck {
      0% { transform: translate(38px, 66px); }
      30% { transform: translate(92px, 29px); }
      55% { transform: translate(126px, 52px); }
      78% { transform: translate(82px, 92px); }
      100% { transform: translate(38px, 66px); }
    }
    @keyframes you {
      0%, 100% { transform: translate(0, 0); }
      12% { transform: translate(5px, -3px); }
      60% { transform: translate(-3px, 10px); }
    }
    @keyframes cpu {
      0%, 100% { transform: translate(0, 10px); }
      55% { transform: translate(-5px, -2px); }
      70% { transform: translate(0, -4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .puck, .t1, .t2, .you, .cpu { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="rk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#d4e3f8"/>
    </linearGradient>
    <radialGradient id="kn" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="currentColor"/>
    </radialGradient>
  </defs>
  <!-- Thành bàn + mặt bàn -->
  <rect x="9" y="20" width="142" height="88" rx="10" fill="#000" opacity=".25"/>
  <rect x="9" y="16" width="142" height="88" rx="10" fill="#1f2d52"/>
  <rect x="15" y="22" width="130" height="76" rx="5" fill="url(#rk)"/>
  <!-- Khe khung thành hai đầu -->
  <rect x="11" y="44" width="5" height="32" rx="2" fill="#070b18"/>
  <rect x="144" y="44" width="5" height="32" rx="2" fill="#070b18"/>
  <!-- Vạch giữa, vòng giữa, vòng trước khung -->
  <path d="M80 22v76" stroke="#e5484d" stroke-width="1.2" opacity=".6"/>
  <circle cx="80" cy="60" r="13" fill="none" stroke="#e5484d" stroke-width="1.2" opacity=".6"/>
  <path d="M15 37a23 23 0 0 1 0 46M145 37a23 23 0 0 0 0 46" fill="none" stroke="#2f6fe4" stroke-width="1" opacity=".5"/>
  <text x="48" y="70" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#1f2d52" opacity=".1" text-anchor="middle">5</text>
  <text x="112" y="70" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#1f2d52" opacity=".1" text-anchor="middle">3</text>
  <!-- Chày -->
  <g class="you" color="#e5484d">
    <circle cx="28" cy="70" r="8" fill="#e5484d"/>
    <circle cx="28" cy="70" r="5.6" fill="none" stroke="#ffd1d3" stroke-width="1.2"/>
    <circle cx="28" cy="70" r="3.3" fill="url(#kn)"/>
  </g>
  <g class="cpu" color="#2f6fe4">
    <circle cx="132" cy="48" r="8" fill="#2f6fe4"/>
    <circle cx="132" cy="48" r="5.6" fill="none" stroke="#cfe0ff" stroke-width="1.2"/>
    <circle cx="132" cy="48" r="3.3" fill="url(#kn)"/>
  </g>
  <!-- Đĩa + vệt -->
  <g class="t2" transform="translate(38 66)"><circle r="3.6" fill="#ffb020"/></g>
  <g class="t1" transform="translate(38 66)"><circle r="4.2" fill="#ffb020"/></g>
  <g class="puck" transform="translate(38 66)">
    <circle r="5" fill="#1b2133"/>
    <circle r="3.3" fill="none" stroke="#ffb020" stroke-width="1.3"/>
  </g>
</svg>
