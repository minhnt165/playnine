<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Guess">
  <meta name="description" content="Word Guess">
  <title>Word Guess</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối và chế độ mù màu đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var s = JSON.parse(localStorage.getItem('playnine-doanchu-settings-v1') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      if (s.contrast === true) document.documentElement.classList.add('contrast');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=1">
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">Word Guess</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <button class="btn-icon" id="btn-new" type="button" data-i18n-attr="aria-label:end.newFree;title:end.newFree">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
        </button>
      </div>
    </header>

    <div class="play">
      <div class="col-board">
        <div class="modes segmented" id="modes" role="group" data-i18n-attr="aria-label:mode.label">
          <button type="button" data-mode="daily" aria-pressed="false"><span data-i18n="mode.daily">Daily</span> <span class="mode-no" id="daily-no"></span></button>
          <button type="button" data-mode="free" aria-pressed="false" data-i18n="mode.free">Free play</button>
        </div>
        <main class="stage" id="stage">
          <div class="board" id="board" role="grid" data-i18n-attr="aria-label:board.label"></div>
        </main>
      </div>

      <div class="dock">
        <div class="keyboard" id="keyboard" role="group" data-i18n-attr="aria-label:kb.label"></div>
        <div class="endbar" id="endbar" hidden>
          <div class="endbar-text">
            <div class="endbar-word" id="endbar-word"></div>
            <div class="endbar-sub" id="endbar-sub"></div>
          </div>
          <div class="endbar-actions">
            <button class="btn btn-ghost" id="btn-result" type="button" data-i18n="end.result">Result</button>
            <button class="btn btn-primary" id="btn-next" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <p class="help"><span class="help-keys" data-i18n-html="help.keys"></span></p>
  </div>

  <div class="sr-only" id="sr-live" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Kết thúc ván / xem kết quả từ hằng ngày -->
  <div class="modal" id="modal-end" hidden>
    <div class="modal-backdrop" data-close="modal-end"></div>
    <div class="modal-card end-card" role="dialog" aria-modal="true" aria-labelledby="end-title">
      <h2 id="end-title"></h2>
      <p class="end-meta" id="end-meta"></p>
      <div class="end-answer"><span data-i18n="end.answer">The word</span> <b id="end-word"></b></div>
      <div class="mini" id="end-mini" aria-hidden="true"></div>
      <p class="end-next" id="end-next"></p>
      <textarea class="share-text" id="share-text" rows="5" readonly hidden></textarea>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-share" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>
          <span data-i18n="end.share">Share</span>
        </button>
        <button class="btn btn-primary" id="btn-end-next" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Bỏ ván đang chơi -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-backdrop" data-close="modal-confirm"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="confirm.title">Give up this word?</h2>
      <p class="modal-text" id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-confirm" data-i18n="kit.cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm" type="button" data-i18n="confirm.ok">Give up</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <p class="modal-text" data-i18n-html="help.intro"></p>
      <p class="modal-text" data-i18n="help.colors"></p>
      <div class="example">
        <div class="ex-row" aria-hidden="true"><span class="ex-tile c">B</span><span class="ex-tile">R</span><span class="ex-tile">A</span><span class="ex-tile">I</span><span class="ex-tile">N</span></div>
        <p data-i18n-html="help.c"></p>
        <div class="ex-row" aria-hidden="true"><span class="ex-tile">T</span><span class="ex-tile">O</span><span class="ex-tile p">A</span><span class="ex-tile">S</span><span class="ex-tile">T</span></div>
        <p data-i18n-html="help.p"></p>
        <div class="ex-row" aria-hidden="true"><span class="ex-tile">H</span><span class="ex-tile">O</span><span class="ex-tile a">U</span><span class="ex-tile">S</span><span class="ex-tile">E</span></div>
        <p data-i18n-html="help.a"></p>
      </div>
      <p class="modal-text" data-i18n-html="help.modes"></p>
      <p class="modal-text" data-i18n="help.hard"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="help.start">Let’s play</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid stat-4">
        <div><dt data-i18n="stats.played">Played</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.winPct">Win %</dt><dd id="stats-pct">0</dd></div>
        <div><dt data-i18n="stats.streak">Daily streak</dt><dd id="stats-streak">0</dd></div>
        <div><dt data-i18n="stats.maxStreak">Best streak</dt><dd id="stats-max">0</dd></div>
      </dl>
      <h3 class="dist-title" data-i18n="stats.dist">Guess distribution</h3>
      <ol class="dist" id="stats-dist"></ol>
      <p class="end-next" id="stats-next" hidden></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-text"><span class="setting-name" data-i18n="set.hard">Hard mode</span><span class="setting-desc" data-i18n="set.hardDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-hard" data-setting="hard">
        </label>
        <label class="setting-row">
          <span class="setting-text"><span class="setting-name" data-i18n="set.contrast">Color blind mode</span><span class="setting-desc" data-i18n="set.contrastDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-contrast" data-setting="contrast">
        </label>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="words.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
