<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: bức tranh 4x3 còn thiếu một mảnh, mảnh cuối bay vào chỗ trống và khớp lại.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động. Nền ô lấy từ preview.bg trong game.json. -->
  <style>
    .fly { animation: fly 3.2s ease-in-out infinite; }
    .ring { animation: ring 3.2s ease-out infinite; opacity: 0; }
    @keyframes fly {
      0%, 12% { transform: translate(34px, 34px) rotate(-8deg); }
      55%, 100% { transform: translate(0, 0) rotate(0); }
    }
    @keyframes ring {
      0%, 54% { opacity: 0; }
      60% { opacity: .9; }
      85%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fly { animation: none; }
      .ring { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3f9e"/>
      <stop offset=".5" stop-color="#e2667a"/>
      <stop offset=".85" stop-color="#ffc56e"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a26b"/>
      <stop offset="1" stop-color="#2b2a63"/>
    </linearGradient>
    <!-- Bức tranh, tọa độ của bàn 120 x 90 -->
    <g id="pic">
      <rect width="120" height="90" fill="url(#sky)"/>
      <circle cx="70" cy="50" r="9" fill="#fff1bf"/>
      <path d="M0 40l14-14 10 8 14-16 16 15 10-7 18 14 12-10 26 18v12H0z" fill="#8a73b8"/>
      <path d="M38 18l5 6-3 2zM14 26l4 4-3 1z" fill="#fff"/>
      <path d="M0 52l18-10 16 8 20-9 22 10 18-8 26 9v8H0z" fill="#4a3a7c"/>
      <rect y="58" width="120" height="32" fill="url(#lake)"/>
      <path d="M60 64h20M63 69h14M66 74h8" stroke="#ffe3a3" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 90V70l6-14 6 14V90zM14 90V74l5-11 5 11v16zM100 90V72l6-12 6 12v18z" fill="#1d1638"/>
      <path d="M30 22l3 2 3-2M84 14l3 2 3-2" stroke="#2a1d4a" stroke-width="1.3" fill="none"/>
    </g>
    <!-- Mảnh ghép 30 x 30: tai trên + phải, lõm dưới + trái -->
    <path id="pc" d="M0 0h11c-2-3-1-8 4-8s6 5 4 8h11v11c3-2 8-1 8 4s-5 6-8 4v11H19c2-3 1-7-4-7s-6 4-4 7H0V19c3 2 7 1 7-4s-4-6-7-4z"/>
    <clipPath id="clip-pc"><use xlink:href="#pc" href="#pc"/></clipPath>
    <clipPath id="clip-board"><rect width="120" height="90" rx="3"/></clipPath>
  </defs>

  <g transform="translate(20 15)">
    <g clip-path="url(#clip-board)"><use xlink:href="#pic" href="#pic"/></g>
    <!-- Đường cắt mờ giữa các mảnh đã ghép -->
    <path d="M30 0v90M60 0v90M90 0v90M0 30h120M0 60h120" stroke="#000" stroke-opacity=".18" stroke-width="1"/>
    <rect width="120" height="90" rx="3" fill="none" stroke="#fff" stroke-opacity=".35"/>
    <!-- Chỗ trống của mảnh cuối -->
    <g transform="translate(60 30)">
      <use xlink:href="#pc" href="#pc" fill="#1b1430" stroke="#fff" stroke-opacity=".55" stroke-dasharray="3 2" stroke-width="1.2"/>
      <rect class="ring" x="-4" y="-4" width="38" height="38" rx="6" fill="none" stroke="#ffd27a" stroke-width="2.5"/>
    </g>
    <!-- Mảnh cuối bay vào -->
    <g transform="translate(60 30)">
      <g class="fly">
        <g clip-path="url(#clip-pc)"><use xlink:href="#pic" href="#pic" transform="translate(-60 -30)"/></g>
        <use xlink:href="#pc" href="#pc" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.4" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
