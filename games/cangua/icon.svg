<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3d70"/>
      <stop offset="1" stop-color="#111733"/>
    </linearGradient>
    <radialGradient id="hi" cx=".34" cy=".28" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- bàn: chữ thập trắng, bốn chuồng màu ở bốn góc, tam giác đích ở giữa -->
  <rect x="8" y="8" width="48" height="48" rx="6" fill="#f4f5fb"/>
  <rect x="8" y="8" width="19" height="19" rx="5" fill="#ec5258"/>
  <rect x="37" y="8" width="19" height="19" rx="5" fill="#2fb368"/>
  <rect x="8" y="37" width="19" height="19" rx="5" fill="#4a86f0"/>
  <rect x="37" y="37" width="19" height="19" rx="5" fill="#f5c22a"/>
  <polygon points="27,27 37,27 32,32" fill="#2fb368"/>
  <polygon points="37,27 37,37 32,32" fill="#f5c22a"/>
  <polygon points="27,37 37,37 32,32" fill="#4a86f0"/>
  <polygon points="27,27 27,37 32,32" fill="#ec5258"/>
  <!-- chỗ đứng trong chuồng -->
  <circle cx="17.5" cy="17.5" r="5" fill="#fff" fill-opacity=".85"/>
  <circle cx="46.5" cy="17.5" r="5" fill="#fff" fill-opacity=".85"/>
  <circle cx="46.5" cy="46.5" r="5" fill="#fff" fill-opacity=".85"/>
  <!-- quân xanh nổi bật ở chuồng dưới trái -->
  <circle cx="17.5" cy="46.5" r="6.6" fill="#fff"/>
  <circle cx="17.5" cy="46.5" r="5.2" fill="#2f6fe4"/>
  <circle cx="17.5" cy="46.5" r="5.2" fill="url(#hi)"/>
</svg>
