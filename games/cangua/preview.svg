<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: bàn cá ngựa thu nhỏ; xúc xắc lăn ra 5, quân xanh nhảy 5 ô
       và đá quân đỏ về chuồng. Hoạt hình CSS, tắt khi người dùng giảm chuyển động (hiện trạng thái cuối).
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt. -->
  <style>
    .blue { animation: blue 6s linear infinite; }
    .red { animation: red 6s ease-in-out infinite; }
    .die { transform-origin: 145px 60px; animation: tumble 6s ease-out infinite; }
    .face-a { animation: fa 6s step-end infinite; }
    .face-b { opacity: 0; animation: fb 6s step-end infinite; }
    @keyframes blue { 0%, 22% { transform: translate(0px, 0px); } 27%, 30% { transform: translate(0px, -6.4px); } 35%, 38% { transform: translate(0px, -12.8px); } 43%, 46% { transform: translate(0px, -19.2px); } 51%, 54% { transform: translate(0px, -25.6px); } 59%, 62% { transform: translate(-6.4px, -32px); } 94% { transform: translate(-6.4px, -32px); opacity: 1; } 98% { opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 0; } }
    @keyframes red { 0%, 64% { transform: translate(0px, 0px); opacity: 1; } 74%, 94% { transform: translate(-9.6px, -41.6px); opacity: 1; } 98% { opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 0; } }
    @keyframes tumble { 0% { transform: rotate(0deg); } 6% { transform: rotate(-20deg); } 12% { transform: rotate(16deg); } 18%, 100% { transform: rotate(0deg); } }
    @keyframes fa { 0% { opacity: 1; } 18% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fb { 0% { opacity: 0; } 18% { opacity: 1; } 99% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .blue, .red, .die, .face-a, .face-b { animation: none; }
      .blue { transform: translate(-6.4px, -32px); }
      .red { transform: translate(-9.6px, -41.6px); }
      .face-a { opacity: 0; }
      .face-b { opacity: 1; }
    }
  </style>
