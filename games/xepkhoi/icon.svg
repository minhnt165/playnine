<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3270"/>
      <stop offset="1" stop-color="#121633"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Lưới 4x4: ô trống mờ, khối màu; hàng dưới đầy sắp xóa -->
  <g fill="#ffffff" opacity=".1">
    <rect x="7" y="7" width="11" height="11" rx="3"/><rect x="20" y="7" width="11" height="11" rx="3"/><rect x="33" y="7" width="11" height="11" rx="3"/><rect x="46" y="7" width="11" height="11" rx="3"/>
    <rect x="7" y="20" width="11" height="11" rx="3"/><rect x="20" y="20" width="11" height="11" rx="3"/><rect x="33" y="20" width="11" height="11" rx="3"/><rect x="46" y="20" width="11" height="11" rx="3"/>
    <rect x="7" y="33" width="11" height="11" rx="3"/><rect x="20" y="33" width="11" height="11" rx="3"/><rect x="33" y="33" width="11" height="11" rx="3"/><rect x="46" y="33" width="11" height="11" rx="3"/>
  </g>
  <!-- Khối L cam -->
  <g fill="#fb7d22">
    <rect x="7" y="7" width="11" height="11" rx="3"/>
    <rect x="7" y="20" width="11" height="11" rx="3"/>
    <rect x="7" y="33" width="11" height="11" rx="3"/>
    <rect x="20" y="33" width="11" height="11" rx="3"/>
  </g>
  <!-- Khối vuông vàng -->
  <g fill="#f5b301">
    <rect x="33" y="20" width="11" height="11" rx="3"/>
    <rect x="46" y="20" width="11" height="11" rx="3"/>
    <rect x="33" y="33" width="11" height="11" rx="3"/>
    <rect x="46" y="33" width="11" height="11" rx="3"/>
  </g>
  <!-- Hàng dưới đầy, sáng lên -->
  <rect x="5" y="44.5" width="54" height="15" rx="5" fill="#7ee8fa" opacity=".35"/>
  <g fill="#1fb5d6">
    <rect x="7" y="46" width="11" height="11" rx="3"/>
    <rect x="20" y="46" width="11" height="11" rx="3"/>
    <rect x="33" y="46" width="11" height="11" rx="3"/>
    <rect x="46" y="46" width="11" height="11" rx="3"/>
  </g>
  <!-- Bóng sáng mặt trên mỗi khối -->
  <g fill="#ffffff" opacity=".35">
    <rect x="9" y="9" width="7" height="2" rx="1"/><rect x="9" y="22" width="7" height="2" rx="1"/><rect x="9" y="35" width="7" height="2" rx="1"/><rect x="22" y="35" width="7" height="2" rx="1"/>
    <rect x="35" y="22" width="7" height="2" rx="1"/><rect x="48" y="22" width="7" height="2" rx="1"/><rect x="35" y="35" width="7" height="2" rx="1"/><rect x="48" y="35" width="7" height="2" rx="1"/>
    <rect x="9" y="48" width="7" height="2" rx="1"/><rect x="22" y="48" width="7" height="2" rx="1"/><rect x="35" y="48" width="7" height="2" rx="1"/><rect x="48" y="48" width="7" height="2" rx="1"/>
  </g>
</svg>
