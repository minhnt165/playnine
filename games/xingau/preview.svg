<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Cảnh: giữ ba con 5, lắc lại hai viên còn lại, ra ngũ quý, ô 50 trên bảng điểm sáng lên. -->
  <style>
    .roll { transform-box: fill-box; transform-origin: center; animation: roll 4s ease-in-out infinite; }
    .roll.r2 { animation-delay: .08s; }
    .old { animation: old 4s steps(1) infinite; }
    .new { opacity: 0; animation: new 4s steps(1) infinite; }
    .score { opacity: 0; transform-box: fill-box; transform-origin: center; animation: score 4s ease-out infinite; }
    .glow { opacity: 0; animation: glow 4s ease-out infinite; }
    @keyframes roll {
      0%, 28% { transform: none; }
      36% { transform: translateY(-14px) rotate(200deg); }
      44% { transform: translateY(1px) rotate(350deg); }
      48%, 100% { transform: rotate(360deg); }
    }
    @keyframes old { 0% { opacity: 1; } 40% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes new { 0% { opacity: 0; } 40% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes score { 0%, 58% { opacity: 0; transform: scale(.4); } 66% { opacity: 1; transform: scale(1.25); } 72%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes glow { 0%, 58% { opacity: 0; } 66%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .roll, .old, .new, .score, .glow { animation: none; }
      .old { opacity: 0; }
      .new, .score, .glow { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="iv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ddc9"/>
    </linearGradient>
    <!-- Mặt 5 (cỡ viên 26) -->
    <g id="five">
      <circle cx="7" cy="7" r="2.6"/><circle cx="19" cy="7" r="2.6"/><circle cx="13" cy="13" r="2.6"/>
      <circle cx="7" cy="19" r="2.6"/><circle cx="19" cy="19" r="2.6"/>
    </g>
    <g id="die">
      <rect y="2.5" width="26" height="26" rx="6" fill="#b9ad94"/>
      <rect width="26" height="26" rx="6" fill="url(#iv)"/>
    </g>
  </defs>

  <!-- Năm viên xúc xắc: viên 1, 2, 4 đang giữ (viền vàng) -->
  <g fill="#1d1b2e">
    <g transform="translate(7 22)">
      <rect x="-2.5" y="-2.5" width="31" height="31" rx="8" fill="#ffc83f"/>
      <use href="#die"/><use href="#five"/>
    </g>
    <g transform="translate(37 22)">
      <rect x="-2.5" y="-2.5" width="31" height="31" rx="8" fill="#ffc83f"/>
      <use href="#die"/><use href="#five"/>
    </g>
    <g transform="translate(67 22)">
      <g class="roll">
        <use href="#die"/>
        <g class="old"><circle cx="19" cy="7" r="2.6"/><circle cx="7" cy="19" r="2.6"/></g>
        <g class="new"><use href="#five"/></g>
      </g>
    </g>
    <g transform="translate(97 22)">
      <rect x="-2.5" y="-2.5" width="31" height="31" rx="8" fill="#ffc83f"/>
      <use href="#die"/><use href="#five"/>
    </g>
    <g transform="translate(127 22)">
      <g class="roll r2">
        <use href="#die"/>
        <g class="old"><circle cx="19" cy="7" r="2.6"/><circle cx="13" cy="13" r="2.6"/><circle cx="7" cy="19" r="2.6"/></g>
        <g class="new"><use href="#five"/></g>
      </g>
    </g>
  </g>

  <!-- Bảng điểm thu nhỏ: hai ô đã ghi, ô thứ ba (ngũ quý) sáng lên với 50 -->
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="11">
    <rect x="12" y="66" width="136" height="14" rx="4" fill="#ffffff" opacity=".12"/>
    <rect x="18" y="71" width="44" height="4" rx="2" fill="#ffffff" opacity=".45"/>
    <text x="140" y="77" text-anchor="end" fill="#ffffff" opacity=".85">25</text>
    <rect x="12" y="83" width="136" height="14" rx="4" fill="#ffffff" opacity=".12"/>
    <rect x="18" y="88" width="56" height="4" rx="2" fill="#ffffff" opacity=".45"/>
    <text x="140" y="94" text-anchor="end" fill="#ffffff" opacity=".85">30</text>
    <rect x="12" y="100" width="136" height="14" rx="4" fill="#ffffff" opacity=".12"/>
    <rect class="glow" x="12" y="100" width="136" height="14" rx="4" fill="#ffc83f" opacity=".9"/>
    <rect x="18" y="105" width="36" height="4" rx="2" fill="#ffffff" opacity=".45"/>
    <text class="score" x="140" y="111" text-anchor="end" fill="#3a2600">50</text>
  </g>
</svg>
