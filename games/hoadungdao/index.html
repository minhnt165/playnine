<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sliding Blocks">
  <meta name="description" content="Sliding Blocks">
  <title>Sliding Blocks</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var t = JSON.parse(localStorage.getItem('playnine-hoadungdao-settings-v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=1">
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">Sliding Blocks</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
      </div>
    </header>

    <div class="hud">
      <button class="hud-box hud-level" id="btn-level" type="button">
        <span class="hud-label" data-i18n="hud.level">Level</span>
        <span class="hud-value"><span id="level">1</span><small id="level-total">/24</small><svg class="hud-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></span>
      </button>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.moves">Moves</div><div class="hud-value" id="moves">0</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.min">Minimum</div><div class="hud-value" id="min">0</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.best">Best</div><div class="hud-value" id="best">–</div></div>
    </div>

    <main class="stage" id="stage">
      <!-- Khay: khung có lối ra ở giữa đáy; các khối là nút (Tab chọn được), vị trí đặt bằng transform -->
      <div class="tray" id="tray">
        <div class="board" id="board" role="group"></div>
        <div class="exit" aria-hidden="true"><svg viewBox="0 0 24 12"><path d="M4 2l8 7 8-7"/></svg><span data-i18n="board.exit">Exit</span></div>
      </div>
    </main>

    <div class="tools">
      <button class="btn btn-ghost" id="btn-undo" type="button" data-i18n-attr="title:tool.undoTitle">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A7.5 7.5 0 0 1 19.6 16l2.3-.8A10 10 0 0 0 12.5 8z"/></svg>
        <span data-i18n="tool.undo">Undo</span>
      </button>
      <button class="btn btn-ghost" id="btn-restart" type="button" data-i18n-attr="title:tool.restartTitle">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
        <span data-i18n="tool.restart">Restart</span>
      </button>
      <button class="btn btn-ghost" id="btn-levels" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
        <span data-i18n="tool.levels">Levels</span>
      </button>
    </div>

    <p class="help"><span class="help-keys" data-i18n-html="help.keys"></span><span class="help-touch" data-i18n="help.touch"></span></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

  <!-- Qua màn -->
  <div class="modal" id="modal-win" hidden>
    <div class="modal-backdrop" data-close="modal-win"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title">Level solved!</h2>
      <p class="modal-text win-result" id="win-result"></p>
      <p class="modal-text win-perfect" id="win-perfect" hidden data-i18n="win.perfect">Perfect!</p>
      <p class="modal-text win-best" id="win-best" hidden data-i18n="win.best">New best for this level!</p>
      <p class="modal-text" id="win-prev" hidden></p>
      <p class="modal-text" id="win-all" hidden data-i18n="win.all"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-replay" type="button" data-i18n="win.replay">Replay</button>
        <button class="btn btn-ghost" id="btn-win-levels" type="button" data-i18n="win.levels">Levels</button>
        <button class="btn btn-primary" id="btn-next" type="button" data-i18n="win.next">Next level</button>
      </div>
    </div>
  </div>

  <!-- Chọn màn -->
  <div class="modal" id="modal-levels" hidden>
    <div class="modal-backdrop" data-close="modal-levels"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="levels-title">
      <div class="modal-head">
        <h2 id="levels-title" data-i18n="levels.title">Levels</h2>
        <span class="badge" id="levels-progress"></span>
      </div>
      <div class="level-grid" id="level-grid"></div>
      <p class="modal-text levels-note" data-i18n="levels.note"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-levels" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <div class="help-legend">
        <span class="legend-blocks" aria-hidden="true"><i class="lg lg-B"></i><i class="lg lg-V"></i><i class="lg lg-H"></i><i class="lg lg-S"></i></span>
        <span data-i18n="help.legend"></span>
      </div>
      <p class="modal-text" data-i18n="help.text"></p>
      <p class="modal-text" data-i18n="help.text2"></p>
      <p class="modal-text" data-i18n="help.text3"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid">
        <div><dt data-i18n="stats.solved">Levels solved</dt><dd id="stats-solved">0</dd></div>
        <div><dt data-i18n="stats.perfect">Solved in the minimum</dt><dd id="stats-perfect">0</dd></div>
        <div><dt data-i18n="stats.played">Attempts</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.won">Solves</dt><dd id="stats-won">0</dd></div>
      </dl>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
