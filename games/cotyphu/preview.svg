<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước Cờ Tỷ Phú: bàn vòng 28 ô, xúc xắc lăn ra 1-3, quân tím đi 4 ô, mua đất (−¤) rồi xây nhà.
       Tự chứa, hoạt hình bằng CSS, tắt khi giảm chuyển động (hiện thế sau khi xây). Nền trong suốt. -->
  <style>
    .board { fill: #c7cae3; }
    .cell { fill: #fdfdff; }
    .mid { fill: #eef0fd; }
    .die rect { fill: #fff; stroke: rgba(0,0,0,.25); stroke-width: .6; }
    .die circle { fill: #1d1f33; }
    .die { transform-box: fill-box; transform-origin: center; animation: roll 6s infinite; }
    .tok { animation: walk 6s infinite; }
    .tok circle { fill: #7c5cff; stroke: #fff; stroke-width: 1.2; }
    .house { transform-box: fill-box; transform-origin: center bottom; animation: build 6s infinite; }
    .own { animation: own 6s infinite; }
    .coin { animation: coin 6s infinite; font: 800 7px system-ui, sans-serif; fill: #dc2626; }
    @keyframes roll { 0% { transform: rotate(-200deg) scale(.6); opacity: 0; } 12% { transform: none; opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes walk {
      0%, 15% { transform: translate(0, 0); }
      18%, 22% { transform: translate(-13.2px, -2px); } 20% { transform: translate(-13.2px, -3px); }
      25%, 29% { transform: translate(-24.2px, 0); }
      32%, 36% { transform: translate(-35.2px, 0); }
      39%, 92% { transform: translate(-46.2px, 0); }
      100% { transform: translate(0, 0); }
    }
    @keyframes own { 0%, 45% { opacity: 0; } 50%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes coin { 0%, 44% { opacity: 0; transform: translateY(0); } 50% { opacity: 1; } 62%, 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes build { 0%, 62% { transform: scale(0); } 70% { transform: scale(1.25); } 75%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    @media (prefers-reduced-motion: reduce) {
      .die, .tok, .house, .own, .coin { animation: none; }
      .tok { transform: translate(-46.2px, 0); }
      .coin { opacity: 0; }
    }
  </style>
  <rect class="board" x="30.1" y="10.1" width="99.8" height="99.8" rx="5"/>
