  <g class="die"><rect x="82" y="56" width="15" height="15" rx="3.5"/><circle cx="86" cy="60" r="1.6"/><circle cx="89.5" cy="63.5" r="1.6"/><circle cx="93" cy="67" r="1.6"/></g>
