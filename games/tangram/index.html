<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tangram">
  <meta name="description" content="Tangram">
  <title>Tangram</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var t = JSON.parse(localStorage.getItem('playnine-tangram-settings-v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=3">
  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">Tangram</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <button class="btn-icon" id="btn-levels" type="button" data-i18n-attr="aria-label:levels.title;title:levels.title">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
        </button>
      </div>
    </header>

    <div class="hud">
      <button class="hud-box hud-puzzle" id="hud-puzzle" type="button" data-i18n-attr="title:levels.title">
        <span class="hud-label" id="puzzle-num">#1</span>
        <span class="hud-value" id="puzzle-name">–</span>
      </button>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.time">Time</div><div class="hud-value" id="time">0:00</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.solved">Solved</div><div class="hud-value" id="solved">0</div></div>
    </div>

    <main class="play">
      <div class="stage" id="stage">
        <svg class="board" id="board" role="application" data-i18n-attr="aria-label:board.label" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="dots" width="1" height="1" patternUnits="userSpaceOnUse">
              <circle cx="0" cy="0" r="0.035" class="dot"/>
              <circle cx="1" cy="0" r="0.035" class="dot"/>
              <circle cx="0" cy="1" r="0.035" class="dot"/>
              <circle cx="1" cy="1" r="0.035" class="dot"/>
            </pattern>
          </defs>
          <rect class="grid" id="grid" x="-3.6" y="-3.6" width="7.2" height="7.2" rx="0.25" fill="url(#dots)"/>
          <g class="target" id="target"></g>
          <g class="pieces" id="pieces"></g>
        </svg>
        <p class="sr-only" id="live" aria-live="polite"></p>
      </div>
      <div class="toolbar" role="toolbar">
        <button class="tool" id="btn-rotate" type="button" data-i18n-attr="aria-label:tool.rotate;title:tool.rotateKey">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l4 4-4 4V7a5 5 0 1 0 5 5h2a7 7 0 1 1-7-7z"/></svg>
          <span data-i18n="tool.rotate">Rotate</span>
        </button>
        <button class="tool" id="btn-flip" type="button" data-i18n-attr="aria-label:tool.flip;title:tool.flipKey">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v20h-2zM9 6v12L3 18zm6 0 6 12h-6z"/></svg>
          <span data-i18n="tool.flip">Flip</span>
        </button>
        <button class="tool" id="btn-hint" type="button" data-i18n-attr="aria-label:tool.hint;title:tool.hintKey">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6v-1H9zm3-19a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/></svg>
          <span data-i18n="tool.hint">Hint</span>
        </button>
        <button class="tool" id="btn-reset" type="button" data-i18n-attr="aria-label:tool.reset;title:tool.resetKey">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
          <span data-i18n="tool.reset">Reset</span>
        </button>
      </div>
    </main>

    <p class="help"><span class="help-keys" data-i18n-html="help.keys"></span><span class="help-touch" data-i18n="help.touch"></span></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Thắng -->
  <div class="modal" id="modal-win" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title" data-i18n="win.title">Solved!</h2>
      <div class="win-figure"><svg id="win-figure" viewBox="-3.7 -3.7 7.4 7.4" aria-hidden="true"></svg></div>
      <p class="modal-text win-line"><span id="win-name"></span> · <b id="win-time"></b></p>
      <p class="modal-text win-note" id="win-note"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-win-levels" type="button" data-i18n="levels.title">Puzzles</button>
        <button class="btn btn-primary" id="btn-next" type="button" data-i18n="win.next">Next puzzle</button>
      </div>
    </div>
  </div>

  <!-- Bỏ màn đang xếp dở -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-backdrop" data-close="modal-confirm"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="confirm.title">Leave this puzzle?</h2>
      <p class="modal-text" data-i18n="confirm.text">This attempt will count as a loss.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-confirm" data-i18n="kit.cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm" type="button" data-i18n="confirm.ok">Leave</button>
      </div>
    </div>
  </div>

  <!-- Chọn màn -->
  <div class="modal" id="modal-levels" hidden>
    <div class="modal-backdrop" data-close="modal-levels"></div>
    <div class="modal-card levels-card" role="dialog" aria-modal="true" aria-labelledby="levels-title">
      <div class="modal-head">
        <h2 id="levels-title" data-i18n="levels.title">Puzzles</h2>
        <span class="levels-count" id="levels-count"></span>
      </div>
      <div class="levels" id="levels"></div>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-levels" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <p class="modal-text" data-i18n="help.text"></p>
      <ul class="help-list">
        <li data-i18n-html="help.drag"></li>
        <li data-i18n-html="help.rotate"></li>
        <li data-i18n-html="help.flip"></li>
        <li data-i18n-html="help.hint"></li>
        <li class="help-keys-row" data-i18n-html="help.keyboard"></li>
      </ul>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid">
        <div><dt data-i18n="stats.played">Attempts</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.won">Wins</dt><dd id="stats-won">0</dd></div>
        <div><dt data-i18n="stats.solved">Puzzles solved</dt><dd id="stats-solved">0</dd></div>
        <div><dt data-i18n="stats.clean">Solved without hints</dt><dd id="stats-clean">0</dd></div>
      </dl>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-text"><span class="setting-name" data-i18n="settings.grid">Grid dots</span><span class="setting-desc" data-i18n="settings.gridDesc"></span></span>
          <input class="switch" type="checkbox" data-setting="grid">
        </label>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.1"></script>
</body>
</html>
