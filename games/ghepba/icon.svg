<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Biểu tượng Ghép Ba: ba viên tròn đỏ thẳng hàng sáng lên giữa các viên khác hình -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d2a7a"/>
      <stop offset="1" stop-color="#140d2e"/>
    </linearGradient>
    <radialGradient id="red" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset=".45" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Hàng trên và dưới: viên khác loại, mờ -->
  <g opacity=".55">
    <rect x="10" y="6" width="12" height="12" rx="3" fill="#3b82f6"/>
    <path d="M32 5.5 38 12 32 18.5 26 12z" fill="#22c55e"/>
    <path d="M48 5.5 54.5 17.5h-13z" fill="#f5b301" stroke="#f5b301" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M16 45.5l5.6 3.2v6.6L16 58.5l-5.6-3.2v-6.6z" fill="#a855f7"/>
    <path d="m32 45.2 1.9 4 4.4.5-3.2 3 .8 4.3-3.9-2.1-3.9 2.1.8-4.3-3.2-3 4.4-.5z" fill="#06b6d4"/>
    <rect x="42" y="46" width="12" height="12" rx="3" fill="#3b82f6"/>
  </g>
  <!-- Hàng giữa: ba viên đỏ đang ghép -->
  <rect x="3" y="21.5" width="58" height="21" rx="10.5" fill="#fde68a" opacity=".22"/>
  <g stroke="#7f1d1d" stroke-width="1.2">
    <circle cx="14" cy="32" r="8.6" fill="url(#red)"/>
    <circle cx="32" cy="32" r="8.6" fill="url(#red)"/>
    <circle cx="50" cy="32" r="8.6" fill="url(#red)"/>
  </g>
  <g fill="#ffffff" opacity=".55">
    <ellipse cx="11.5" cy="28" rx="3.6" ry="1.8" transform="rotate(-20 11.5 28)"/>
    <ellipse cx="29.5" cy="28" rx="3.6" ry="1.8" transform="rotate(-20 29.5 28)"/>
    <ellipse cx="47.5" cy="28" rx="3.6" ry="1.8" transform="rotate(-20 47.5 28)"/>
  </g>
</svg>
