<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game: bàn chữ thập Kiểu Anh, quân nhảy qua quân bên cạnh vào lỗ giữa, quân bị nhảy qua mờ đi.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động; nền trong suốt (nền thẻ lấy từ preview.bg). -->
  <style>
    .jump { animation: jump 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .gone { animation: gone 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { animation: ring 3.4s ease-in-out infinite; opacity: 0; }
    @keyframes jump {
      0%, 30% { transform: translate(0, 0); opacity: 1; }
      42% { transform: translate(0, 14px) scale(1.45); }
      54%, 86% { transform: translate(0, 28px); opacity: 1; }
      93% { transform: translate(0, 28px); opacity: 0; }
      94% { transform: translate(0, 0); opacity: 0; }
      100% { transform: translate(0, 0); opacity: 1; }
    }
    @keyframes gone { 0%, 44% { opacity: 1; transform: none; } 58%, 92% { opacity: 0; transform: scale(.3); } 100% { opacity: 1; transform: none; } }
    @keyframes ring { 0%, 4% { opacity: 0; } 12%, 30% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .jump, .gone, .ring { animation: none; } .ring { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b574"/><stop offset="1" stop-color="#b8773c"/></linearGradient>
    <radialGradient id="peg" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#bfe8ff"/><stop offset=".6" stop-color="#2f8fe0"/><stop offset="1" stop-color="#0f4f9a"/></radialGradient>
  </defs>
  <!-- Bàn gỗ hình chữ thập -->
  <path d="M62 9h36a5 5 0 0 1 5 5v23h23a5 5 0 0 1 5 5v36a5 5 0 0 1-5 5h-23v23a5 5 0 0 1-5 5H62a5 5 0 0 1-5-5V83H34a5 5 0 0 1-5-5V42a5 5 0 0 1 5-5h23V14a5 5 0 0 1 5-5z" fill="url(#wood)" stroke="#7a4a24" stroke-width="2"/>
  <g fill="#5b3518"><circle cx="66" cy="18" r="3.6"/><circle cx="80" cy="18" r="3.6"/><circle cx="94" cy="18" r="3.6"/><circle cx="66" cy="32" r="3.6"/><circle cx="80" cy="32" r="3.6"/><circle cx="94" cy="32" r="3.6"/><circle cx="38" cy="46" r="3.6"/><circle cx="52" cy="46" r="3.6"/><circle cx="66" cy="46" r="3.6"/><circle cx="80" cy="46" r="3.6"/><circle cx="94" cy="46" r="3.6"/><circle cx="108" cy="46" r="3.6"/><circle cx="122" cy="46" r="3.6"/><circle cx="38" cy="60" r="3.6"/><circle cx="52" cy="60" r="3.6"/><circle cx="66" cy="60" r="3.6"/><circle cx="80" cy="60" r="3.6"/><circle cx="94" cy="60" r="3.6"/><circle cx="108" cy="60" r="3.6"/><circle cx="122" cy="60" r="3.6"/><circle cx="38" cy="74" r="3.6"/><circle cx="52" cy="74" r="3.6"/><circle cx="66" cy="74" r="3.6"/><circle cx="80" cy="74" r="3.6"/><circle cx="94" cy="74" r="3.6"/><circle cx="108" cy="74" r="3.6"/><circle cx="122" cy="74" r="3.6"/><circle cx="66" cy="88" r="3.6"/><circle cx="80" cy="88" r="3.6"/><circle cx="94" cy="88" r="3.6"/><circle cx="66" cy="102" r="3.6"/><circle cx="80" cy="102" r="3.6"/><circle cx="94" cy="102" r="3.6"/></g>
  <g fill="url(#peg)"><circle cx="66" cy="18" r="5.4"/><circle cx="80" cy="18" r="5.4"/><circle cx="94" cy="18" r="5.4"/><circle cx="66" cy="32" r="5.4"/><circle cx="94" cy="32" r="5.4"/><circle cx="38" cy="46" r="5.4"/><circle cx="52" cy="46" r="5.4"/><circle cx="66" cy="46" r="5.4"/><circle cx="94" cy="46" r="5.4"/><circle cx="108" cy="46" r="5.4"/><circle cx="122" cy="46" r="5.4"/><circle cx="38" cy="60" r="5.4"/><circle cx="52" cy="60" r="5.4"/><circle cx="66" cy="60" r="5.4"/><circle cx="94" cy="60" r="5.4"/><circle cx="108" cy="60" r="5.4"/><circle cx="122" cy="60" r="5.4"/><circle cx="38" cy="74" r="5.4"/><circle cx="52" cy="74" r="5.4"/><circle cx="66" cy="74" r="5.4"/><circle cx="80" cy="74" r="5.4"/><circle cx="94" cy="74" r="5.4"/><circle cx="108" cy="74" r="5.4"/><circle cx="122" cy="74" r="5.4"/><circle cx="66" cy="88" r="5.4"/><circle cx="80" cy="88" r="5.4"/><circle cx="94" cy="88" r="5.4"/><circle cx="66" cy="102" r="5.4"/><circle cx="80" cy="102" r="5.4"/><circle cx="94" cy="102" r="5.4"/></g>
  <!-- Lỗ đích sáng lên, quân nhảy, quân bị nhảy qua mờ đi -->
  <circle class="ring" cx="80" cy="60" r="7.2" fill="none" stroke="#a48bff" stroke-width="2.2"/>
  <circle class="gone" cx="80" cy="46" r="5.4" fill="url(#peg)"/>
  <circle class="jump" cx="80" cy="32" r="5.4" fill="url(#peg)"/>
</svg>
