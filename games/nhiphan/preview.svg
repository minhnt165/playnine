<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: lưới 4×4, ô cam là 0, ô xanh là 1; một ô được chạm hai lần
       (trống → 0 → 1), rồi hàng vừa đủ sáng lên. Nền trong suốt (nền lấy từ preview.bg), tắt hoạt hình khi giảm chuyển động. -->
  <style>
    text { font: 800 15px system-ui, sans-serif; text-anchor: middle; }
    .g0 { fill: #f28a2e; }
    .g1 { fill: #3d7bfd; }
    .t0 { fill: #3b1800; }
    .t1 { fill: #ffffff; }
    .e { fill: rgba(255, 255, 255, 0.1); }
    .p0 { fill: rgba(245, 158, 66, 0.22); stroke: #f59e42; stroke-width: 1.5; }
    .p1 { fill: rgba(79, 134, 255, 0.28); stroke: #4f86ff; stroke-width: 1.5; }
    .pt0 { fill: #ffb871; }
    .pt1 { fill: #a3c0ff; }
    .s0 { opacity: 0; animation: s0 4s steps(1) infinite; }
    .s1 { opacity: 0; animation: s1 4s steps(1) infinite; }
    .tap { opacity: 0; transform-origin: 92px 74px; animation: tap 4s ease-out infinite; }
    .glow { opacity: 0; animation: glow 4s ease-out infinite; }
    @keyframes s0 { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes s1 { 0% { opacity: 0; } 50% { opacity: 1; } 95% { opacity: 0; } }
    @keyframes tap {
      0%, 20% { opacity: 0; transform: scale(1.6); }
      25% { opacity: 0.9; transform: scale(1); }
      32%, 45% { opacity: 0; transform: scale(1.6); }
      50% { opacity: 0.9; transform: scale(1); }
      57%, 100% { opacity: 0; transform: scale(1.6); }
    }
    @keyframes glow { 0%, 52% { opacity: 0; } 62% { opacity: 1; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .s0, .tap, .glow { animation: none; opacity: 0; }
      .s1 { animation: none; opacity: 1; }
    }
  </style>
  <!-- Lời giải:  0110 / 1001 / 0011 / 1100 -->
  <rect x="24" y="4" width="112" height="112" rx="12" fill="rgba(255, 255, 255, 0.06)"/>
  <!-- hàng 0 -->
  <rect class="g0" x="30" y="10" width="22" height="22" rx="5"/><text class="t0" x="41" y="26.5">0</text>
  <rect class="e" x="56" y="10" width="22" height="22" rx="5"/>
  <rect class="p1" x="82" y="10" width="22" height="22" rx="5"/><text class="pt1" x="93" y="26.5">1</text>
  <rect class="g0" x="108" y="10" width="22" height="22" rx="5"/><text class="t0" x="119" y="26.5">0</text>
  <!-- hàng 1 -->
  <rect class="g1" x="30" y="36" width="22" height="22" rx="5"/><text class="t1" x="41" y="52.5">1</text>
  <rect class="p0" x="56" y="36" width="22" height="22" rx="5"/><text class="pt0" x="67" y="52.5">0</text>
  <rect class="e" x="82" y="36" width="22" height="22" rx="5"/>
  <rect class="g1" x="108" y="36" width="22" height="22" rx="5"/><text class="t1" x="119" y="52.5">1</text>
  <!-- hàng 2: ô (2,2) được chạm -->
  <rect class="p0" x="30" y="62" width="22" height="22" rx="5"/><text class="pt0" x="41" y="78.5">0</text>
  <rect class="g0" x="56" y="62" width="22" height="22" rx="5"/><text class="t0" x="67" y="78.5">0</text>
  <rect class="e" x="82" y="62" width="22" height="22" rx="5"/>
  <g class="s0"><rect class="p0" x="82" y="62" width="22" height="22" rx="5"/><text class="pt0" x="93" y="78.5">0</text></g>
  <g class="s1"><rect class="p1" x="82" y="62" width="22" height="22" rx="5"/><text class="pt1" x="93" y="78.5">1</text></g>
  <rect class="g1" x="108" y="62" width="22" height="22" rx="5"/><text class="t1" x="119" y="78.5">1</text>
  <!-- hàng 3 -->
  <rect class="g1" x="30" y="88" width="22" height="22" rx="5"/><text class="t1" x="41" y="104.5">1</text>
  <rect class="e" x="56" y="88" width="22" height="22" rx="5"/>
  <rect class="g0" x="82" y="88" width="22" height="22" rx="5"/><text class="t0" x="93" y="104.5">0</text>
  <rect class="e" x="108" y="88" width="22" height="22" rx="5"/>
  <!-- hàng 2 đủ hai 0 hai 1: viền sáng -->
  <rect class="glow" x="27" y="59" width="106" height="28" rx="7" fill="none" stroke="#c4b5ff" stroke-width="2.5"/>
  <circle class="tap" cx="92" cy="74" r="11" fill="none" stroke="#ffffff" stroke-width="2.5"/>
</svg>
