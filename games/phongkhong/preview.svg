<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tên lửa rơi xiên, bệ giữa bắn đạn chặn, quả cầu nổ nở ra nuốt tên lửa.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động (khi đó đứng yên ở khung quả cầu đang nổ).
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt. -->
  <defs>
    <radialGradient id="pk-boom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity=".9"/>
    </radialGradient>
  </defs>
  <style>
    .m1 { stroke-dasharray: 130; stroke-dashoffset: 58; animation: m1 3s linear infinite; }
    .h1 { transform: translate(43px, 57px); animation: h1 3s linear infinite; }
    .shot { stroke-dasharray: 41; stroke-dashoffset: 0; animation: shot 3s linear infinite; }
    .boom { transform-origin: 83px 57px; animation: boom 3s linear infinite; }
    .m2 { stroke-dasharray: 151; stroke-dashoffset: 91; animation: m2 3s linear infinite; }
    .h2 { transform: translate(-44px, 42px); animation: h2 3s linear infinite; }
    .tw { animation: tw 2.4s ease-in-out infinite alternate; }
    @keyframes m1 { 0% { stroke-dashoffset: 130; opacity: 1; } 50% { stroke-dashoffset: 58; opacity: 1; } 55%, 100% { stroke-dashoffset: 58; opacity: 0; } }
    @keyframes h1 { 0% { transform: translate(0, 0); opacity: 1; } 50% { transform: translate(43px, 57px); opacity: 1; } 52%, 100% { transform: translate(43px, 57px); opacity: 0; } }
    @keyframes shot { 0%, 22% { stroke-dashoffset: 41; opacity: 1; } 48% { stroke-dashoffset: 0; opacity: 1; } 58%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes boom { 0%, 47% { transform: scale(0); } 60%, 74% { transform: scale(1); } 90%, 100% { transform: scale(0); } }
    @keyframes m2 { 0% { stroke-dashoffset: 151; opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: 76; opacity: 0; } }
    @keyframes h2 { 0% { transform: translate(0, 0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(-55px, 52px); opacity: 0; } }
    @keyframes tw { from { opacity: .25; } to { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) {
      .m1, .h1, .shot, .boom, .m2, .h2, .tw { animation: none; }
    }
  </style>
  <!-- Sao -->
  <g fill="#ffffff">
    <circle class="tw" cx="18" cy="14" r=".9"/>
    <circle cx="62" cy="9" r=".7" opacity=".6"/>
    <circle class="tw" cx="104" cy="22" r=".8"/>
    <circle cx="146" cy="12" r=".9" opacity=".7"/>
    <circle cx="28" cy="44" r=".6" opacity=".5"/>
    <circle class="tw" cx="140" cy="52" r=".7"/>
  </g>
  <!-- Tên lửa địch -->
  <path class="m1" d="M40 0L118 104" stroke="#ff4d6d" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle class="h1" cx="40" cy="0" r="2.2" fill="#ffe1e8"/>
  <path class="m2" d="M150 0L40 104" stroke="#ff4d6d" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle class="h2" cx="150" cy="0" r="2.2" fill="#ffe1e8"/>
  <!-- Đạn chặn từ bệ giữa + quả cầu nổ -->
  <path class="shot" d="M80 95L83 57" stroke="#37f0ff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle class="boom" cx="83" cy="57" r="14" fill="url(#pk-boom)"/>
  <!-- Mặt đất -->
  <rect x="0" y="104" width="160" height="16" fill="#7c5cff" opacity=".3"/>
  <path d="M0 104H160" stroke="#7c5cff" stroke-width="1.5"/>
  <!-- Bệ phóng -->
  <g fill="#b18cff" fill-opacity=".3" stroke="#b18cff" stroke-width="1.5" stroke-linejoin="round">
    <path d="M2 104l6-8h12l6 8z"/>
    <path d="M68 104l6-8h12l6 8z"/>
    <path d="M134 104l6-8h12l6 8z"/>
  </g>
  <!-- Thành phố -->
  <g fill="#4dff9c" fill-opacity=".25" stroke="#4dff9c" stroke-width="1.3">
    <path d="M32 104v-8h5v-6h5v4h5v10z"/>
    <path d="M50 104v-11h5v4h5v-6h4v13z"/>
    <path d="M96 104v-7h5v-7h5v5h5v9z"/>
    <path d="M114 104v-10h5v5h5v-8h4v13z"/>
  </g>
</svg>
