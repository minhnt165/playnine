    <circle cx="32" cy="32.5" r="3.6"/>
  </g>
  <!-- Đường nhảy -->
  <path d="M36 40 Q44 30 36 25" fill="none" stroke="#ffc21a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 4.2"/>
  <path d="M33.5 26.2l3.4-1.6-.4 3.7" fill="none" stroke="#ffc21a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
