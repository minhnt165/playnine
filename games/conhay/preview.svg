       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động. Nền ô xem trước lấy từ preview.bg. -->
  <style>
    .edge { fill: #3a3570; stroke: #3a3570; stroke-width: 11; stroke-linejoin: round; }
    .star { fill: #f3e4c2; stroke: #f3e4c2; stroke-width: 7.5; stroke-linejoin: round; }
    .holes circle { fill: #d6bf8f; }
    .r { fill: #ef4c52; stroke: #a3232a; stroke-width: .8; }
    .b { fill: #3a7ff2; stroke: #1d4fb0; stroke-width: .8; }
    .shine { fill: #fff; opacity: .45; }
    .hop { animation: hop 4.4s ease-in-out infinite; }
    .trail { fill: none; stroke: #ffc21a; stroke-width: 1.4; stroke-dasharray: 2 2; stroke-linecap: round; stroke-linejoin: round; animation: trail 4.4s ease-in-out infinite; }
    @keyframes hop { 0%, 14% { transform: translate(0px, 0px) scale(1); opacity: 1; } 22% { transform: translate(-3.7px, -6.4px) scale(1.35); } 30% { transform: translate(-7.4px, -12.8px) scale(1); } 38% { transform: translate(-11.100000000000001px, -19.200000000000003px) scale(1.35); } 46% { transform: translate(-14.8px, -25.6px) scale(1); } 54% { transform: translate(-11.100000000000001px, -32px) scale(1.35); } 62% { transform: translate(-7.4px, -38.4px) scale(1); } 88% { transform: translate(-7.4px, -38.4px) scale(1); opacity: 1; } 94% { transform: translate(-7.4px, -38.4px) scale(1); opacity: 0; } 95% { transform: translate(0px, 0px) scale(1); opacity: 0; } 100% { transform: translate(0px, 0px) scale(1); opacity: 1; } }
    @keyframes trail { 0%, 60% { opacity: 0; } 66%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .hop, .trail { animation: none; }
      .trail { opacity: 1; }
    }
  </style>
