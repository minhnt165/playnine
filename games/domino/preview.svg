  <!-- Ảnh xem trước Đô-mi-nô: dây quân trên bàn, quân [6|1] từ tay trượt lên nối vào đầu 6. Nền thẻ lấy từ preview.bg. -->
  <style>
    .sh { fill: rgba(0, 0, 0, .35); }
    .tf { fill: #fdfaf2; stroke: #cbbfa8; stroke-width: .5; }
    .dv { stroke: #b3a68e; stroke-width: .6; stroke-linecap: round; }
    .pp circle { fill: #1b1e2d; }
    .ring { fill: rgba(251, 191, 36, .25); stroke: #fbbf24; stroke-width: 1.2; stroke-dasharray: 3 2; transform-origin: 143px 50px; animation: ring 3.2s ease-in-out infinite; }
    .glow { fill: none; stroke: #fbbf24; stroke-width: 1.4; opacity: .9; animation: glow 3.2s linear infinite; }
    .slide { animation: slide 3.2s cubic-bezier(.3, .9, .3, 1) infinite; transform-origin: 136px 50px; }
    @keyframes slide {
      0%, 22% { transform: translate(-60px, 56px) rotate(90deg) scale(.78); opacity: 1; }
      48%, 86% { transform: none; opacity: 1; }
      93% { transform: none; opacity: 0; }
      94% { transform: translate(-60px, 56px) rotate(90deg) scale(.78); opacity: 0; }
      100% { transform: translate(-60px, 56px) rotate(90deg) scale(.78); opacity: 1; }
    }
    @keyframes ring { 0%, 40% { opacity: 1; transform: scale(1); } 20% { transform: scale(1.18); } 48%, 100% { opacity: 0; } }
    @keyframes glow { 0%, 22% { opacity: .9; } 28%, 94% { opacity: 0; } 100% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {
      .slide, .ring, .glow { animation: none; }
      .ring, .glow { opacity: 0; }
    }
  </style>
