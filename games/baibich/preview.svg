<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: bốn người ra lá vào giữa bàn, lá bích (chủ) ăn nước và sáng lên.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động. Nền lấy từ preview.bg trong game.json. -->
  <style>
    .c { animation: 4s ease-out infinite both; }
    .n { animation-name: n; }
    .w { animation-name: w; }
    .e { animation-name: e; }
    .s { animation-name: s; }
    .glow { animation: glow 4s ease-out infinite both; }
    .seat { fill: rgba(255, 255, 255, .16); }
    @keyframes w { 0% { transform: translate(-40px, 0); opacity: 0; } 8%, 85% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
    @keyframes n { 0%, 15% { transform: translate(0, -36px); opacity: 0; } 23%, 85% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
    @keyframes e { 0%, 30% { transform: translate(40px, 0); opacity: 0; } 38%, 85% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
    @keyframes s { 0%, 45% { transform: translate(0, 40px); opacity: 0; } 53%, 85% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
    @keyframes glow { 0%, 56% { opacity: 0; } 64%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .c, .glow { animation: none; }
    }
  </style>
  <defs>
    <g id="cf">
      <rect width="24" height="34" rx="3" fill="#fbfcfe" stroke="#0b2530" stroke-opacity=".25"/>
    </g>
    <path id="sp" d="M0-7c-4.6 4.2-7.8 6.6-7.8 9.6 0 2.3 1.7 3.8 3.7 3.8 1.3 0 2.4-.6 3-1.6-.3 2.3-1.1 3.8-2.5 4.7h7.2c-1.4-.9-2.2-2.4-2.5-4.7.6 1 1.7 1.6 3 1.6 2 0 3.7-1.5 3.7-3.8 0-3-3.2-5.4-7.8-9.6z"/>
    <path id="ht" d="M0 6c-4.4-3.4-7-5.6-7-8.3a3.2 3.2 0 0 1 7-1.5 3.2 3.2 0 0 1 7 1.5c0 2.7-2.6 4.9-7 8.3z"/>
  </defs>
  <!-- Bốn chỗ ngồi -->
  <circle class="seat" cx="80" cy="10" r="7"/>
  <circle class="seat" cx="14" cy="60" r="7"/>
  <circle class="seat" cx="146" cy="60" r="7"/>
  <circle class="seat" cx="80" cy="112" r="7"/>
  <circle cx="80" cy="10" r="5" fill="#63d3b0"/>
  <circle cx="14" cy="60" r="5" fill="#ff8fa3"/>
  <circle cx="146" cy="60" r="5" fill="#ffb46b"/>
  <circle cx="80" cy="112" r="5" fill="#6f9bff"/>
  <!-- Tây dẫn K♥ -->
  <g class="c w"><g transform="translate(36 44)"><use href="#cf"/><text x="4" y="11" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#d6334f">K</text><use href="#ht" x="12" y="21" fill="#d6334f"/></g></g>
  <!-- Bắc theo 9♥ -->
  <g class="c n"><g transform="translate(68 20)"><use href="#cf"/><text x="4" y="11" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#d6334f">9</text><use href="#ht" x="12" y="21" fill="#d6334f"/></g></g>
  <!-- Đông theo A♥ -->
  <g class="c e"><g transform="translate(100 44)"><use href="#cf"/><text x="4" y="11" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#d6334f">A</text><use href="#ht" x="12" y="21" fill="#d6334f"/></g></g>
  <!-- Bạn hết cơ, cắt bằng 3♠ và ăn nước -->
  <g class="c s"><g transform="translate(68 66)">
    <rect class="glow" x="-3" y="-3" width="30" height="40" rx="5" fill="none" stroke="#ffc53d" stroke-width="3"/>
    <use href="#cf"/><text x="4" y="11" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#14202b">3</text><use href="#sp" x="12" y="21" fill="#14202b"/>
  </g></g>
</svg>
