<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Kịch bản 5 giây: chạm lần lượt S T O N E từ hàng chữ R O T E N S lên hàng từ, gửi, hiện "+1200". -->
  <style>
    .t { font: 800 12px system-ui, 'Segoe UI', sans-serif; fill: #4a2c0e; }
    .k0 { animation: k0 5s ease-in-out infinite; }
    .k1 { animation: k1 5s ease-in-out infinite; }
    .k2 { animation: k2 5s ease-in-out infinite; }
    .k3 { animation: k3 5s ease-in-out infinite; }
    .k4 { animation: k4 5s ease-in-out infinite; }
    .pts { animation: pts 5s ease-out infinite; opacity: 0; }
    .chip { animation: chip 5s ease-out infinite; opacity: 0; }
    .glow { animation: glow 5s ease-out infinite; opacity: 0; }
    /* S: ô 5 → khe 0 */
    @keyframes k0 { 0%, 8% { transform: translate(0, 0); } 12%, 80% { transform: translate(-107px, -42px); } 88%, 100% { transform: translate(0, 0); } }
    /* T: ô 2 → khe 1 */
    @keyframes k1 { 0%, 15% { transform: translate(0, 0); } 19%, 80% { transform: translate(-11px, -42px); } 88%, 100% { transform: translate(0, 0); } }
    /* O: ô 1 → khe 2 */
    @keyframes k2 { 0%, 22% { transform: translate(0, 0); } 26%, 80% { transform: translate(37px, -42px); } 88%, 100% { transform: translate(0, 0); } }
    /* N: ô 4 → khe 3 */
    @keyframes k3 { 0%, 29% { transform: translate(0, 0); } 33%, 80% { transform: translate(-11px, -42px); } 88%, 100% { transform: translate(0, 0); } }
    /* E: ô 3 → khe 4 */
    @keyframes k4 { 0%, 36% { transform: translate(0, 0); } 40%, 80% { transform: translate(37px, -42px); } 88%, 100% { transform: translate(0, 0); } }
    @keyframes glow { 0%, 46% { opacity: 0; } 50%, 74% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes pts { 0%, 48% { opacity: 0; transform: translateY(6px); } 54%, 74% { opacity: 1; transform: translateY(0); } 80%, 100% { opacity: 0; transform: translateY(-4px); } }
    @keyframes chip { 0%, 52% { opacity: 0; } 58%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .k0, .k1, .k2, .k3, .k4, .pts, .chip, .glow { animation: none; }
      .chip { opacity: 1; }
    }
  </style>

  <!-- Các từ đã tìm -->
  <g opacity=".95">
    <rect x="28" y="9" width="30" height="13" rx="6.5" fill="#8b6cff" fill-opacity=".45"/>
    <text x="43" y="18.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#fff">TON</text>
    <rect x="62" y="9" width="34" height="13" rx="6.5" fill="#8b6cff" fill-opacity=".6"/>
    <text x="79" y="18.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#fff">REST</text>
    <g class="chip">
      <rect x="100" y="9" width="38" height="13" rx="6.5" fill="#f5a83c" fill-opacity=".85"/>
      <text x="119" y="18.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#fff">STONE</text>
    </g>
  </g>

  <!-- Hàng từ đang ghép: 5 khe -->
  <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
    <path d="M24 66h18M48 66h18M72 66h18M96 66h18M120 66h18"/>
  </g>
  <rect class="glow" x="19" y="42" width="122" height="28" rx="8" fill="#4ade80" fill-opacity=".18" stroke="#4ade80" stroke-opacity=".7" stroke-width="1.5"/>
  <text class="pts" x="80" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#4ade80">+1200</text>

  <!-- Hàng chữ cái: R O T E N S (ô i ở x = 10 + 24i) -->
  <g fill="#000" fill-opacity=".22">
    <rect x="10" y="86" width="20" height="20" rx="5"/><rect x="34" y="86" width="20" height="20" rx="5"/><rect x="58" y="86" width="20" height="20" rx="5"/>
    <rect x="82" y="86" width="20" height="20" rx="5"/><rect x="106" y="86" width="20" height="20" rx="5"/><rect x="130" y="86" width="20" height="20" rx="5"/>
  </g>
  <defs>
    <linearGradient id="tl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e4"/><stop offset="1" stop-color="#f3d99c"/></linearGradient>
    <g id="tile"><rect y="2" width="20" height="20" rx="5" fill="#b5843c"/><rect width="20" height="20" rx="5" fill="url(#tl)"/></g>
  </defs>
  <g transform="translate(10 86)"><use href="#tile"/><text class="t" x="10" y="14.5" text-anchor="middle">R</text></g>
  <g class="k2"><g transform="translate(34 86)"><use href="#tile"/><text class="t" x="10" y="14.5" text-anchor="middle">O</text></g></g>
  <g class="k1"><g transform="translate(58 86)"><use href="#tile"/><text class="t" x="10" y="14.5" text-anchor="middle">T</text></g></g>
  <g class="k4"><g transform="translate(82 86)"><use href="#tile"/><text class="t" x="10" y="14.5" text-anchor="middle">E</text></g></g>
  <g class="k3"><g transform="translate(106 86)"><use href="#tile"/><text class="t" x="10" y="14.5" text-anchor="middle">N</text></g></g>
  <g class="k0"><g transform="translate(130 86)"><use href="#tile"/><text class="t" x="10" y="14.5" text-anchor="middle">S</text></g></g>
</svg>
