<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d52"/>
      <stop offset="1" stop-color="#07081a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="12" cy="12" r="1" fill="#fff" opacity=".7"/>
  <circle cx="52" cy="20" r="1" fill="#9fd8ff" opacity=".8"/>
  <circle cx="46" cy="8" r=".8" fill="#fff" opacity=".6"/>
  <!-- Phi thuyền địch (con mắt), mỗi điểm ảnh 3px -->
  <g fill="#ff5ad9" filter="url(#glow)" transform="translate(20 8)">
    <path d="M9 0h6v3H9zM6 3h12v3H6zM3 6h6v3H3zM15 6h6v3h-6zM0 9h6v3H0zM9 9h6v3H9zM18 9h6v3h-6zM3 12h6v3H3zM15 12h6v3h-6zM6 15h12v3H6zM3 18h3v3H3zM9 18h6v3H9zM18 18h3v3h-3zM0 21h3v3H0zM21 21h3v3h-3z"/>
  </g>
  <!-- Đạn -->
  <rect x="30.5" y="35" width="3" height="8" fill="#eafcff" filter="url(#glow)"/>
  <!-- Tàu người chơi -->
  <g fill="#4dff9c" filter="url(#glow)" transform="translate(18.5 46)">
    <path d="M12 0h3v2h-3zM10.5 2h6v4h-6zM3 6h2v2H3zM22 6h2v2h-2zM1.5 8h24v2h-24zM0 10h27v5H0z"/>
  </g>
</svg>
