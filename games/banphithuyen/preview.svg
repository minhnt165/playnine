  <g class="march" filter="url(#g)">
    <g transform="scale(1.2)">
      <g fill="#d4ff3a"><use href="#a2" x="2" y="0"/><use href="#a2" x="18" y="0"/><use href="#a2" x="34" y="0"/><use href="#a2" x="50" y="0"/><use href="#a2" x="66" y="0"/><use href="#a2" x="82" y="0"/></g>
      <g fill="#ff5ad9"><use href="#a1" x="0.5" y="13"/><use href="#a1" x="16.5" y="13"/><use href="#a1" x="32.5" y="13"/><use href="#a1" x="48.5" y="13"/><use href="#a1" x="64.5" y="13"/><use href="#a1" x="80.5" y="13"/></g>
      <g fill="#37f0ff"><use href="#a0" x="0" y="26"/><use href="#a0" x="16" y="26"/><use href="#a0" x="32" y="26"/><use href="#a0" x="48" y="26"/><use href="#a0" x="64" y="26"/><use href="#a0" x="80" y="26"/><use href="#a0" x="0" y="39"/><use href="#a0" x="16" y="39"/><use href="#a0" x="48" y="39"/><use href="#a0" x="64" y="39"/><use href="#a0" x="80" y="39"/></g>
    </g>
  </g>
  <g fill="#3cff8a" filter="url(#g)" opacity=".9">
    <use href="#shd" transform="translate(14 84) scale(1.5)"/><use href="#sh" transform="translate(58 84) scale(1.5)"/><use href="#sh" transform="translate(102 84) scale(1.5)"/>
  </g>
  <rect x="0" y="113" width="160" height=".8" fill="#3cff8a" opacity=".6"/>
  <g class="ship">
    <g class="shot"><rect x="10.5" y="-8" width="1.6" height="5" fill="#eafcff" filter="url(#g)"/></g>
