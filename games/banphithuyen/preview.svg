<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: đội hình phi thuyền đi ngang rồi xuống, tàu bắn lên, khiên, đĩa bay.
       Hoạt hình bằng CSS bên trong file, tắt khi người dùng giảm chuyển động. Nền trong suốt (preview.bg). -->
  <style>
    .f0 { animation: fa 1s steps(1) infinite; }
    .f1 { animation: fb 1s steps(1) infinite; }
    @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } }
    .march { animation: march 6s steps(12) infinite alternate; }
    @keyframes march { from { transform: translate(8px, 16px); } to { transform: translate(42px, 16px); } }
    .ship { animation: ship 6s ease-in-out infinite alternate; }
    @keyframes ship { 0% { transform: translate(52px, 100px); } 50% { transform: translate(86px, 100px); } 100% { transform: translate(64px, 100px); } }
    .shot { animation: shot 1.2s linear infinite; }
    @keyframes shot { from { transform: translateY(0); opacity: 1; } 85% { opacity: 1; } to { transform: translateY(-62px); opacity: 0; } }
    .ufo { animation: ufo 7s linear infinite; }
    @keyframes ufo { from { transform: translate(-30px, 3px); } to { transform: translate(170px, 3px); } }
    .tw { animation: tw 2.4s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      .f0, .f1, .march, .ship, .shot, .ufo, .tw { animation: none; }
      .f1 { opacity: 0; }
      .march { transform: translate(25px, 16px); }
      .ship { transform: translate(64px, 100px); }
      .ufo { transform: translate(110px, 3px); }
      .shot { transform: translateY(-30px); }
    }
  </style>
  <defs>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation=".9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
