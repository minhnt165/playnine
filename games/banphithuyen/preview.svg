  </defs>
  <g fill="#fff">
    <circle class="tw" cx="8" cy="20" r=".7"/><circle cx="150" cy="30" r=".6" opacity=".6"/><circle class="tw" cx="136" cy="70" r=".7" style="animation-delay:-1.2s"/>
    <circle cx="20" cy="80" r=".5" opacity=".5"/><circle cx="96" cy="46" r=".5" opacity=".4"/><circle class="tw" cx="40" cy="6" r=".6" style="animation-delay:-.6s"/>
