<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Biểu tượng Tìm Chữ: tờ giấy 3x3 chữ cái, từ CAT đọc chéo được khoanh bằng vệt bút dạ quang -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa94d"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="7" y="7" width="50" height="50" rx="10" fill="#fffaf0"/>
  <line x1="18" y1="46" x2="46" y2="18" stroke="#22c3b5" stroke-opacity=".7" stroke-width="13" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="13.5" text-anchor="middle">
    <g fill="#d3c3a3">
      <text x="18" y="23">K</text><text x="32" y="23">S</text>
      <text x="18" y="37">E</text><text x="46" y="37">R</text>
      <text x="32" y="51">O</text><text x="46" y="51">M</text>
    </g>
    <g fill="#2a2236">
      <text x="18" y="51">C</text><text x="32" y="37">A</text><text x="46" y="23">T</text>
    </g>
  </g>
</svg>
