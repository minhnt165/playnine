<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Cảnh: bốn lá bay từ hộp bài (người, nhà cái, người, nhà cái úp), người chơi Xì Dách A + K (21),
       lá úp của nhà cái lật ra 7 (17), chồng chip thắng rơi xuống. -->
  <style>
    .c { animation: 6s ease-out infinite; }
    .c1 { animation-name: c1; }
    .c2 { animation-name: c2; }
    .c3 { animation-name: c3; }
    .c4 { animation-name: c4; }
    .flip { transform-box: fill-box; transform-origin: center; animation: 6s linear infinite; }
    .back { animation-name: back; }
    .face { animation-name: face; }
    .pop { transform-box: fill-box; transform-origin: center; animation: 6s ease-out infinite; }
    .b21 { animation-name: b21; }
    .b17 { animation-name: b17; }
    .win { animation: win 6s ease-out infinite; }
    /* Lá bay từ hộp bài (góc phải trên) tới chỗ: lệch so với chỗ cuối */
    @keyframes c1 { 0%, 4% { opacity: 0; transform: translate(66px, -54px) scale(.6) rotate(-20deg); } 12% { opacity: 1; transform: none; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes c2 { 0%, 10% { opacity: 0; transform: translate(66px, -2px) scale(.6) rotate(-20deg); } 18% { opacity: 1; transform: none; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes c3 { 0%, 16% { opacity: 0; transform: translate(48px, -54px) scale(.6) rotate(-20deg); } 24% { opacity: 1; transform: none; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes c4 { 0%, 22% { opacity: 0; transform: translate(48px, -2px) scale(.6) rotate(-20deg); } 30% { opacity: 1; transform: none; } 92% { opacity: 1; } 100% { opacity: 0; } }
    /* Lật lá úp: lưng thu hẹp rồi mặt mở ra */
    @keyframes back { 0%, 50% { transform: scaleX(1); } 54%, 100% { transform: scaleX(0); } }
    @keyframes face { 0%, 54% { transform: scaleX(0); } 58%, 100% { transform: scaleX(1); } }
    @keyframes b21 { 0%, 34% { opacity: 0; transform: scale(.3); } 40% { opacity: 1; transform: scale(1.2); } 44%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes b17 { 0%, 60% { opacity: 0; transform: scale(.3); } 65% { opacity: 1; transform: scale(1.15); } 69%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes win { 0%, 70% { opacity: 0; transform: translate(0, -30px); } 78% { opacity: 1; transform: none; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .c, .flip, .pop, .win { animation: none; }
      .back { transform: scaleX(0); }
    }
  </style>
  <defs>
    <path id="sp" d="M12 1.8c.5.6 9.6 7.2 9.6 12.9 0 2.9-2.3 5.1-5 5.1-1.6 0-3-.7-3.8-1.9.3 1.8 1 3.1 2.5 4.5H8.7c1.5-1.4 2.2-2.7 2.5-4.5-.8 1.2-2.2 1.9-3.8 1.9-2.7 0-5-2.2-5-5.1C2.4 9 11.5 2.4 12 1.8z"/>
    <path id="ht" d="M12 21.6c-.5-.5-9.7-7-9.7-13.2 0-3.2 2.4-5.6 5.5-5.6 1.8 0 3.3.9 4.2 2.4.9-1.5 2.4-2.4 4.2-2.4 3.1 0 5.5 2.4 5.5 5.6 0 6.2-9.2 12.7-9.7 13.2z"/>
    <g id="cl"><circle cx="12" cy="6.9" r="4.6"/><circle cx="6.6" cy="13.9" r="4.6"/><circle cx="17.4" cy="13.9" r="4.6"/><path d="M12 12.6c-.1 4.1-.9 6.9-3.2 9.7h6.4c-2.3-2.8-3.1-5.6-3.2-9.7z"/></g>
    <rect id="face" width="30" height="42" rx="3.5" fill="#fffefb" stroke="#d6d2e4" stroke-width=".8"/>
    <g id="bk">
      <rect width="30" height="42" rx="3.5" fill="#5b3fd8" stroke="#3f27ad" stroke-width=".8"/>
      <rect x="3" y="3" width="24" height="36" rx="2.5" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1"/>
      <path d="M15 15.5c.5 3 2.6 5 5.5 5.5-2.9.5-5 2.5-5.5 5.5-.5-3-2.6-5-5.5-5.5 2.9-.5 5-2.5 5.5-5.5z" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Hộp bài -->
  <g transform="translate(124 8)">
    <use href="#bk" transform="translate(3 3) scale(.75)"/>
    <use href="#bk" transform="translate(1.5 1.5) scale(.75)"/>
    <use href="#bk" transform="scale(.75)"/>
  </g>

  <g font-family="system-ui, sans-serif" font-weight="800">
    <!-- Nhà cái: 10 nhép ngửa + lá úp (lật ra 7 cơ) -->
    <g class="c c2"><g transform="translate(58 10)">
      <use href="#face"/>
      <text x="2.6" y="12" font-size="11" letter-spacing="-1" fill="#191b31">10</text>
      <use href="#cl" transform="translate(8 19) scale(.6)" fill="#191b31"/>
    </g></g>
    <g class="c c4"><g transform="translate(76 10)">
      <g class="flip face">
        <use href="#face"/>
        <text x="4" y="12" font-size="11" fill="#c62828">7</text>
        <use href="#ht" transform="translate(8 19) scale(.6)" fill="#c62828"/>
      </g>
      <g class="flip back"><use href="#bk"/></g>
    </g></g>

    <!-- Người chơi: Át bích + Già cơ -->
    <g class="c c1"><g transform="translate(58 66)">
      <use href="#face"/>
      <text x="4" y="12" font-size="11" fill="#191b31">A</text>
      <use href="#sp" transform="translate(7 18) scale(.68)" fill="#191b31"/>
    </g></g>
    <g class="c c3"><g transform="translate(76 66)">
      <use href="#face"/>
      <text x="4" y="12" font-size="11" fill="#c62828">K</text>
      <rect x="5" y="16" width="20" height="22" rx="2" fill="none" stroke="#c49a2c" stroke-width="1.2"/>
      <use href="#ht" transform="translate(9.5 21) scale(.46)" fill="#c62828"/>
    </g></g>

    <!-- Tổng điểm -->
    <g class="pop b17">
      <rect x="28" y="24" width="24" height="14" rx="7" fill="#000" fill-opacity=".32"/>
      <text x="40" y="34.5" font-size="10" text-anchor="middle" fill="#ffffff">17</text>
    </g>
    <g class="pop b21">
      <rect x="28" y="80" width="24" height="14" rx="7" fill="#ffc83f"/>
      <text x="40" y="90.5" font-size="10" text-anchor="middle" fill="#3a2600">21</text>
    </g>
  </g>

  <!-- Chồng chip thắng rơi xuống cạnh tay người chơi -->
  <g class="win">
    <ellipse cx="124" cy="96" rx="11" ry="4.5" fill="#000" fill-opacity=".25"/>
    <circle cx="124" cy="90" r="10" fill="#d33a3a" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="3.4 2.6"/>
    <circle cx="124" cy="85" r="10" fill="#1f9a5b" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="3.4 2.6"/>
    <circle cx="124" cy="80" r="10" fill="#ffc83f" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="3.4 2.6"/>
    <circle cx="124" cy="80" r="5.6" fill="none" stroke="#9a6a00" stroke-width="1.2"/>
  </g>
</svg>
