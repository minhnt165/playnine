<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Cảnh: phi thuyền bắn một viên đạn, tảng đá lớn vỡ thành hai tảng vừa; đá khác trôi, đĩa bay lướt ngang. -->
  <style>
    .rock { fill: rgba(201, 184, 255, .1); stroke: #c9b8ff; stroke-width: 1.6; stroke-linejoin: round; }
    .glow { fill: none; stroke-width: 4.5; stroke-opacity: .2; stroke-linejoin: round; }
    .ship { fill: none; stroke: #7df9ff; stroke-width: 1.8; stroke-linejoin: round; }
    .ufo { fill: none; stroke: #ff7ac6; stroke-width: 1.4; stroke-linejoin: round; }
    .shot { animation: shot 2.4s linear infinite; }
    .target { animation: target 2.4s steps(1, end) infinite; }
    .half-a { animation: half-a 2.4s ease-out infinite; }
    .half-b { animation: half-b 2.4s ease-out infinite; }
    .burst { animation: burst 2.4s ease-out infinite; transform-origin: 118px 36px; }
    .drift-1 { animation: drift-1 6s ease-in-out infinite alternate; }
    .drift-2 { animation: drift-2 5s ease-in-out infinite alternate; }
    .drift-3 { animation: drift-3 7s ease-in-out infinite alternate; }
    .saucer { animation: saucer 4.8s linear infinite; }
    .flame { animation: flame .25s steps(2, end) infinite; }
    @keyframes shot {
      0% { transform: translate(0, 0); opacity: 1; }
      40% { transform: translate(36px, -26px); opacity: 1; }
      41%, 100% { transform: translate(36px, -26px); opacity: 0; }
    }
    @keyframes target { 0% { opacity: 1; } 40% { opacity: 0; } 92% { opacity: 1; } }
    @keyframes half-a {
      0%, 39% { opacity: 0; transform: translate(0, 0); }
      41% { opacity: 1; transform: translate(0, 0); }
      90% { opacity: 1; transform: translate(14px, -12px); }
      100% { opacity: 0; transform: translate(16px, -14px); }
    }
    @keyframes half-b {
      0%, 39% { opacity: 0; transform: translate(0, 0); }
      41% { opacity: 1; transform: translate(0, 0); }
      90% { opacity: 1; transform: translate(10px, 16px); }
      100% { opacity: 0; transform: translate(11px, 18px); }
    }
    @keyframes burst {
      0%, 39% { opacity: 0; transform: scale(.3); }
      42% { opacity: .9; transform: scale(.5); }
      65%, 100% { opacity: 0; transform: scale(1.6); }
    }
    @keyframes drift-1 { to { transform: translate(8px, 6px) rotate(8deg); } }
    @keyframes drift-2 { to { transform: translate(-7px, -5px); } }
    @keyframes drift-3 { to { transform: translate(6px, -8px); } }
    @keyframes saucer { from { transform: translate(-30px, 0); } to { transform: translate(190px, 0); } }
    @keyframes flame { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .shot, .target, .half-a, .half-b, .burst, .drift-1, .drift-2, .drift-3, .saucer, .flame { animation: none; }
      .shot { transform: translate(18px, -13px); }
      .half-a, .half-b, .burst { opacity: 0; }
      .saucer { transform: translate(40px, 0); }
    }
  </style>

  <!-- Sao -->
  <g fill="#dfe3ff" opacity=".55">
    <circle cx="14" cy="12" r=".8"/><circle cx="58" cy="20" r=".6"/><circle cx="92" cy="10" r=".7"/><circle cx="148" cy="62" r=".7"/>
    <circle cx="22" cy="70" r=".6"/><circle cx="86" cy="104" r=".8"/><circle cx="104" cy="74" r=".5"/><circle cx="6" cy="104" r=".6"/>
  </g>

  <!-- Đá trôi -->
  <g class="drift-1">
    <path class="glow" stroke="#c9b8ff" d="M20 26l9-6 10 2 4 9-4 9-11 2-8-6z"/>
    <path class="rock" d="M20 26l9-6 10 2 4 9-4 9-11 2-8-6z"/>
  </g>
  <g class="drift-2">
    <path class="glow" stroke="#c9b8ff" d="M126 86l6-4 7 2 2 6-4 6-7 0-4-5z"/>
    <path class="rock" d="M126 86l6-4 7 2 2 6-4 6-7 0-4-5z"/>
  </g>
  <g class="drift-3">
    <path class="glow" stroke="#c9b8ff" d="M30 96l4-3 4 1 1 4-3 3-4 0z"/>
    <path class="rock" d="M30 96l4-3 4 1 1 4-3 3-4 0z"/>
  </g>

  <!-- Tảng đá lớn bị bắn trúng, vỡ đôi -->
  <g class="target">
    <path class="glow" stroke="#c9b8ff" d="M106 30l9-8 11 1 6 9-2 11-10 6-11-3-4-8z"/>
    <path class="rock" d="M106 30l9-8 11 1 6 9-2 11-10 6-11-3-4-8z"/>
  </g>
  <circle class="burst" cx="118" cy="36" r="10" fill="none" stroke="#c9b8ff" stroke-width="1.2"/>
  <path class="rock half-a" d="M112 30l5-5 7 1 3 5-2 6-6 2-6-3z"/>
  <path class="rock half-b" d="M112 40l5-4 6 1 3 5-3 5-6 1-5-3z"/>

  <!-- Đĩa bay -->
  <g class="saucer">
    <path class="glow" stroke="#ff7ac6" d="M0 14l5-4h10l5 4-5 4H5z"/>
    <path class="ufo" d="M0 14l5-4h10l5 4-5 4H5zM0 14h20M7 10l1.5-3.5h3L13 10"/>
  </g>

  <!-- Phi thuyền (mũi chĩa lên phải) + lửa đẩy + viên đạn -->
  <g transform="translate(72 64) rotate(-36)">
    <path class="flame" d="M-7 -4L-15 0L-7 4" fill="none" stroke="#ffb347" stroke-width="1.6" stroke-linejoin="round"/>
    <path class="glow" stroke="#7df9ff" d="M12 0L-8 -8L-5 0L-8 8z"/>
    <path class="ship" d="M12 0L-8 -8L-5 0L-8 8z"/>
  </g>
  <g transform="translate(82 57)">
    <circle class="shot" r="1.8" fill="#fff3b0"/>
  </g>
</svg>
