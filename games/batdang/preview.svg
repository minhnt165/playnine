<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: lưới 4×4 có dấu bất đẳng thức, số được điền dần rồi xóa để chơi lại;
       hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động. Nền ô xem trước lấy từ preview.bg trong game.json. -->
  <style>
    .cell { fill: #ffffff; opacity: .94; }
    .giv { fill: #e3e0f7; }
    .num { font: 800 14px system-ui, sans-serif; text-anchor: middle; }
    .g { fill: #241b5e; }
    .d { fill: #6a4cf5; opacity: 0; animation: fill 9s ease-out infinite; }
    .s { fill: none; stroke: #ffb547; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .p { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0; transform: translateY(3px); } 4%, 84% { opacity: 1; transform: none; } 92%, 100% { opacity: 0; } }
    @keyframes pulse { 50% { transform: scale(1.2); stroke: #ffd38a; } }
    @media (prefers-reduced-motion: reduce) { .d { animation: none; opacity: 1; } .p { animation: none; } }
  </style>
  <rect class="cell" x="24.5" y="4.5" width="21" height="21" rx="4"/>
  <rect class="cell" x="54.5" y="4.5" width="21" height="21" rx="4"/>
