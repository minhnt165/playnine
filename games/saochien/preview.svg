<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: đề Sao Chiến 5x5 thật (một lời giải), 5 vùng màu viền dày; sao đặt lần lượt,
