<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Biểu tượng Chia Ô: lưới 3x3 chia thành ba hình chữ nhật màu, mỗi hình một số -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2a6e"/>
      <stop offset="1" stop-color="#141236"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- hình 1x2 trên trái -->
  <rect x="8.5" y="8.5" width="30" height="14" rx="4" fill="#ff8a73" stroke="#ffd2c8" stroke-width="2"/>
  <!-- hình 3x1 bên phải -->
  <rect x="41.5" y="8.5" width="14" height="47" rx="4" fill="#4fb3f0" stroke="#c9e8fc" stroke-width="2"/>
  <!-- hình 2x2 dưới trái -->
  <rect x="8.5" y="25.5" width="30" height="30" rx="5" fill="#3fd08e" stroke="#c8f0dc" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" fill="#14123a">
    <text x="23.5" y="20.3" font-size="11">2</text>
    <text x="48.5" y="36.6" font-size="12">3</text>
    <text x="23.5" y="48" font-size="21">4</text>
  </g>
</svg>
