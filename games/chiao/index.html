<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#f3f4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rectangles">
  <meta name="description" content="Rectangles">
  <title>Rectangles</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Áp giao diện sáng/tối đã chọn trước khi vẽ trang để tránh nháy màu
    try {
      var t = JSON.parse(localStorage.getItem('playnine-chiao-settings-v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_kit/kit.css?v=2">
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <h1 class="logo" data-i18n="app.name">Rectangles</h1>
        <button class="badge size-badge" id="btn-size" type="button">7x7</button>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" type="button" data-open="modal-help" data-i18n-attr="aria-label:kit.help;title:kit.help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>
        </button>
        <button class="btn-icon" id="btn-stats" type="button" data-open="modal-stats" data-i18n-attr="aria-label:kit.stats;title:kit.stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="btn-icon" type="button" data-open="modal-settings" data-i18n-attr="aria-label:kit.settings;title:kit.settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <button class="btn-icon" id="btn-new" type="button" data-i18n-attr="aria-label:kit.newGame;title:kit.newGame">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
        </button>
      </div>
    </header>

    <div class="hud">
      <div class="hud-box"><div class="hud-label" data-i18n="hud.time">Time</div><div class="hud-value" id="time">0:00</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.filled">Filled</div><div class="hud-value" id="filled">0%</div></div>
      <div class="hud-box"><div class="hud-label" data-i18n="hud.best">Best</div><div class="hud-value" id="best">–</div></div>
    </div>

    <main class="stage">
      <!-- Bàn chơi: lớp hình đã vẽ, lớp ô (đường lưới + số), khung xem trước khi kéo, con trỏ bàn phím -->
      <div class="board" id="board" tabindex="0" role="application" aria-describedby="sr-cell">
        <div class="rects" id="rects"></div>
        <div class="cells" id="cells"></div>
        <div class="preview" id="preview" hidden><span class="preview-label" id="preview-label"></span></div>
        <div class="cursor" id="cursor"></div>
      </div>
      <p class="sr-only" id="sr-cell" aria-live="polite"></p>
    </main>

    <div class="controls">
      <button class="btn btn-ghost" id="btn-undo" type="button" data-i18n-attr="title:btn.undoLong">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.2 16l2.4-.8A10.5 10.5 0 0 0 12.5 8z"/></svg>
        <span data-i18n="btn.undo">Undo</span>
      </button>
      <button class="btn btn-ghost" id="btn-redo" type="button" data-i18n-attr="title:btn.redoLong">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 10.6A10.5 10.5 0 0 0 1.4 15.2l2.4.8A8 8 0 0 1 16.6 12.4L13 16h9V7l-3.6 3.6z"/></svg>
        <span data-i18n="btn.redo">Redo</span>
      </button>
      <button class="btn btn-ghost" id="btn-clear" type="button" data-i18n-attr="title:btn.clearLong">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        <span data-i18n="btn.clear">Clear</span>
      </button>
      <button class="btn btn-primary" id="btn-hint" type="button" data-i18n-attr="title:btn.hintLong">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6v-1.5H9V21zm3-19a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/></svg>
        <span data-i18n="btn.hint">Hint</span>
      </button>
    </div>

    <p class="help"><span class="help-keys" data-i18n-html="help.keys"></span><span class="help-touch" data-i18n="help.touch"></span></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Thắng -->
  <div class="modal" id="modal-win" hidden>
    <div class="modal-backdrop" data-close="modal-win"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title" data-i18n="win.title">Grid split!</h2>
      <p class="modal-text"><span data-i18n="win.time">Your time</span>: <b class="win-time" id="win-time"></b> <span class="win-size" id="win-size"></span></p>
      <p class="modal-text win-best" id="win-best" hidden data-i18n="win.best">New best time!</p>
      <p class="modal-text" id="win-assisted" hidden></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-win" data-i18n="kit.close">Close</button>
        <button class="btn btn-primary" id="btn-again" type="button" data-i18n="kit.playAgain">Play again</button>
      </div>
    </div>
  </div>

  <!-- Bỏ đề đang chơi -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-backdrop" data-close="modal-confirm"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="confirm.title">Leave this puzzle?</h2>
      <p class="modal-text" data-i18n="confirm.text">It will count as a loss.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal-confirm" data-i18n="kit.cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm" type="button" data-i18n="kit.newGame">New game</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-backdrop" data-close="modal-help"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="kit.help">How to play</h2>
      <div class="help-row">
        <!-- Ví dụ 4x4 đã giải: mỗi hình một màu, số trong hình bằng diện tích -->
        <svg class="help-art" viewBox="0 0 124 124" aria-hidden="true">
          <rect class="ha-bg" x="0" y="0" width="124" height="124" rx="10"/>
          <rect class="ha-r f1" x="4" y="4" width="116" height="26" rx="5"/>
          <rect class="ha-r f3" x="4" y="33" width="55" height="87" rx="5"/>
          <rect class="ha-r f2" x="62" y="33" width="58" height="26" rx="5"/>
          <rect class="ha-r f5" x="62" y="62" width="58" height="58" rx="5"/>
          <path class="ha-grid" d="M33 4V120M62 4V120M91 4V120M4 33H120M4 62H120M4 91H120"/>
          <g class="ha-n" text-anchor="middle" dominant-baseline="central">
            <text x="77" y="17">4</text><text x="77" y="46">2</text><text x="107" y="77">4</text><text x="46" y="107">6</text>
          </g>
        </svg>
        <ul class="help-list">
          <li data-i18n="help.rule1"></li>
          <li data-i18n="help.rule2"></li>
          <li data-i18n="help.rule3"></li>
        </ul>
      </div>
      <p class="modal-text" data-i18n="help.play"></p>
      <p class="modal-text" data-i18n="help.modes"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-help" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-stats" hidden>
    <div class="modal-backdrop" data-close="modal-stats"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" data-i18n="kit.stats">Statistics</h2>
      <dl class="stat-grid">
        <div><dt data-i18n="stats.played">Played</dt><dd id="stats-played">0</dd></div>
        <div><dt data-i18n="stats.won">Solved</dt><dd id="stats-won">0</dd></div>
        <div><dt data-i18n="stats.streak">Streak</dt><dd id="stats-streak">0</dd></div>
        <div><dt id="stats-best-s-label"></dt><dd id="stats-best-s">–</dd></div>
        <div><dt id="stats-best-m-label"></dt><dd id="stats-best-m">–</dd></div>
        <div><dt id="stats-best-l-label"></dt><dd id="stats-best-l">–</dd></div>
      </dl>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-stats" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-backdrop" data-close="modal-settings"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="kit.settings">Settings</h2>
      <div class="settings-list">
        <div class="setting">
          <span class="setting-name" data-i18n="setting.size">Board size</span>
          <div class="segmented size-seg" data-setting="size">
            <button type="button" data-value="s">7x7<small data-i18n="diff.s">Easy</small></button>
            <button type="button" data-value="m">10x10<small data-i18n="diff.m">Medium</small></button>
            <button type="button" data-value="l">13x13<small data-i18n="diff.l">Hard</small></button>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-text"><span class="setting-name" data-i18n="setting.errors">Show mistakes</span><span class="setting-desc" data-i18n="setting.errorsDesc"></span></span>
          <input class="switch" type="checkbox" data-setting="errors">
        </label>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.theme">Theme</span>
          <div class="segmented" data-setting="theme">
            <button type="button" data-value="auto" data-i18n="kit.themeAuto">Auto</button>
            <button type="button" data-value="light" data-i18n="kit.themeLight">Light</button>
            <button type="button" data-value="dark" data-i18n="kit.themeDark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" data-i18n="kit.lang">Language</span>
          <div class="segmented" data-setting="lang">
            <button type="button" data-value="en">English</button>
            <button type="button" data-value="vi">Tiếng Việt</button>
          </div>
        </div>
        <label class="setting-row" id="setting-sound">
          <span class="setting-text"><span class="setting-name" data-i18n="kit.sound">Sound</span><span class="setting-desc" data-i18n="kit.soundDesc"></span></span>
          <input class="switch" type="checkbox" id="sw-sound">
        </label>
      </div>
      <p class="app-version" id="app-version"></p>
      <div class="modal-actions"><button class="btn btn-primary" type="button" data-close="modal-settings" data-i18n="kit.close">Close</button></div>
    </div>
  </div>

  <script src="../_kit/kit.js?v=1"></script>
  <script src="i18n.js?v=1.0.0"></script>
  <script src="engine.js?v=1.0.0"></script>
  <script src="../sdk/playnine.js?v=2"></script>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
