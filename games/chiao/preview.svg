<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: lưới 5x5 đã chia một phần, ngón tay kéo từ góc này sang góc kia
       vẽ hình 2x3 (khung nét đứt + nhãn diện tích 6) rồi hình đổi màu vì đúng.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động; nền trong suốt (nền thẻ lấy từ preview.bg). -->
  <style>
    .grow { animation: grow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 0; }
    .fill { animation: fill 4s ease-in-out infinite; }
    .tag { animation: tag 4s ease-in-out infinite; }
    .finger { animation: finger 4s ease-in-out infinite; }
    @keyframes grow {
      0%, 8% { transform: scale(.334, .5); opacity: 0; }
      12% { transform: scale(.334, .5); opacity: 1; }
      44% { transform: scale(1, 1); opacity: 1; }
      52%, 100% { transform: scale(1, 1); opacity: 0; }
    }
    @keyframes fill { 0%, 48% { opacity: 0; } 54%, 90% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes tag { 0%, 30% { opacity: 0; } 36%, 48% { opacity: 1; } 54%, 100% { opacity: 0; } }
    @keyframes finger {
      0%, 6% { transform: translate(0, 0); opacity: 0; }
      12% { transform: translate(0, 0); opacity: .95; }
      44% { transform: translate(32px, 16px); opacity: .95; }
      52%, 100% { transform: translate(32px, 16px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grow, .tag, .finger { animation: none; opacity: 0; }
      .fill { animation: none; opacity: 1; }
    }
  </style>
  <!-- Bàn 5x5: ô 16, góc trên trái (40, 20) -->
  <rect x="36" y="16" width="88" height="88" rx="9" fill="#131626"/>
  <g stroke-width="1.8">
    <rect x="41.5" y="21.5" width="45" height="13" rx="3.5" fill="#62302a" stroke="#ff8a73"/>
    <rect x="89.5" y="21.5" width="29" height="29" rx="3.5" fill="#1b4868" stroke="#4fb3f0"/>
    <rect x="41.5" y="37.5" width="29" height="29" rx="3.5" fill="#3a2f78" stroke="#a08bff"/>
    <rect x="73.5" y="37.5" width="13" height="29" rx="3.5" fill="#5a4412" stroke="#f2b630"/>
  </g>
  <!-- Hình vừa vẽ đúng: đổi màu -->
  <rect class="fill" x="41.5" y="69.5" width="45" height="29" rx="3.5" fill="#1b5340" stroke="#3fd08e" stroke-width="1.8"/>
  <!-- Đường lưới -->
  <path d="M56 20V100M72 20V100M88 20V100M104 20V100M40 36H120M40 52H120M40 68H120M40 84H120" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
  <!-- Số -->
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle" fill="#eef0ff">
    <text x="64" y="31.5">3</text>
    <text x="112" y="47.5">4</text>
    <text x="48" y="63.5">4</text>
    <text x="80" y="47.5">2</text>
    <text x="112" y="79.5">6</text>
    <text x="64" y="95.5">6</text>
  </g>
  <!-- Ô số 6 ở góc dưới phải còn trống: chấm tròn -->
  <circle cx="112" cy="76" r="6.5" fill="#ffffff" fill-opacity=".1"/>
  <!-- Khung xem trước đang kéo: lớn dần từ ô (3,0) tới ô (4,2) -->
  <rect class="grow" x="41" y="69" width="46" height="30" rx="3.5" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-width="1.8" stroke-dasharray="4 3"/>
  <g class="tag">
    <rect x="91" y="86" width="24" height="13" rx="6.5" fill="#22a85a"/>
    <text x="103" y="95.8" font-family="system-ui, sans-serif" font-weight="800" font-size="9.5" text-anchor="middle" fill="#ffffff">6</text>
  </g>
  <!-- Ngón tay -->
  <g class="finger">
    <circle cx="48" cy="76" r="7" fill="#ffffff" fill-opacity=".9"/>
    <circle cx="48" cy="76" r="10.5" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
