<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: quân trắng đi từ điểm giữa lên, ghép ba quân thẳng hàng thành mill
       (vạch vàng hiện ra), rồi một quân đen bị ăn. Hoạt hình CSS, tắt khi người dùng giảm chuyển động
       (hiện trạng thái cuối). Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt. -->
  <style>
    .scene { animation: scene 6s ease-in-out infinite; }
    .slide { animation: slide 6s ease-in-out infinite; }
    .mill { stroke-dasharray: 70; animation: mill 6s ease-out infinite; }
    .gone { transform-box: fill-box; transform-origin: center; opacity: 0; animation: gone 6s ease-in infinite; }
    .aim { opacity: 0; animation: aim 6s linear infinite; }
    .hint { opacity: 0; animation: hint 6s ease-in-out infinite; }
    @keyframes scene { 0% { opacity: 0; } 5%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes slide { 0%, 18% { transform: translate(0, 16.7px); } 30%, 100% { transform: none; } }
    @keyframes hint { 0%, 8% { opacity: 0; } 12%, 24% { opacity: 1; } 30%, 100% { opacity: 0; } }
    @keyframes mill { 0%, 32% { stroke-dashoffset: 70; } 44%, 100% { stroke-dashoffset: 0; } }
    @keyframes aim { 0%, 46% { opacity: 0; } 50%, 58% { opacity: 1; } 62%, 100% { opacity: 0; } }
    @keyframes gone { 0%, 56% { opacity: 1; transform: none; } 66%, 100% { opacity: 0; transform: scale(.3); } }
    @media (prefers-reduced-motion: reduce) {
      .scene, .slide, .mill, .gone, .aim, .hint { animation: none; }
      .mill { stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <radialGradient id="w" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#efe9dc"/>
      <stop offset="1" stop-color="#c2b69b"/>
    </radialGradient>
    <radialGradient id="b" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#7a809e"/>
      <stop offset=".5" stop-color="#363a50"/>
      <stop offset="1" stop-color="#15171f"/>
    </radialGradient>
    <g id="pw"><circle r="7" fill="url(#w)" stroke="#7d6f55" stroke-width=".9"/><circle r="4" fill="none" stroke="#a3967a" stroke-width=".7"/></g>
    <g id="pb"><circle r="7" fill="url(#b)" stroke="#e8d3a8" stroke-opacity=".45" stroke-width=".9"/><circle r="4" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width=".7"/></g>
  </defs>

  <!-- Bàn cờ: ba hình vuông + bốn đường nối, 24 điểm -->
  <rect x="21" y="1" width="118" height="118" rx="9" fill="#f0d7a4" fill-opacity=".16" stroke="#ecd3a2" stroke-opacity=".25"/>
  <g fill="none" stroke="#ecd3a2" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round">
    <rect x="30" y="10" width="100" height="100"/>
    <rect x="46.7" y="26.7" width="66.6" height="66.6"/>
    <rect x="63.3" y="43.3" width="33.4" height="33.4"/>
    <path d="M80 10v33.3M80 76.7V110M30 60h33.3M96.7 60H130"/>
  </g>
  <g fill="#ecd3a2">
    <circle cx="30" cy="10" r="2.2"/><circle cx="80" cy="10" r="2.2"/><circle cx="130" cy="10" r="2.2"/>
    <circle cx="80" cy="26.7" r="2.2"/><circle cx="63.3" cy="43.3" r="2.2"/><circle cx="80" cy="43.3" r="2.2"/><circle cx="96.7" cy="43.3" r="2.2"/>
    <circle cx="30" cy="60" r="2.2"/><circle cx="63.3" cy="60" r="2.2"/><circle cx="96.7" cy="60" r="2.2"/><circle cx="113.3" cy="60" r="2.2"/><circle cx="130" cy="60" r="2.2"/>
    <circle cx="80" cy="76.7" r="2.2"/><circle cx="96.7" cy="76.7" r="2.2"/><circle cx="46.7" cy="93.3" r="2.2"/><circle cx="113.3" cy="93.3" r="2.2"/>
    <circle cx="30" cy="110" r="2.2"/><circle cx="80" cy="110" r="2.2"/><circle cx="130" cy="110" r="2.2"/>
  </g>

  <g class="scene">
    <!-- Mill 3-4-5 (vạch vàng dưới quân) -->
    <path class="mill" d="M46.7 26.7H113.3" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" stroke-opacity=".9"/>
    <!-- Điểm đến được gợi ý -->
    <circle class="hint" cx="80" cy="26.7" r="3.2" fill="#b9a6ff"/>

    <!-- Quân đen -->
    <use href="#pb" x="46.7" y="60"/>
    <use href="#pb" x="80" y="93.3"/>
    <use href="#pb" x="63.3" y="76.7"/>
    <g class="gone"><use href="#pb" x="113.3" y="60"/></g>
    <circle class="aim" cx="113.3" cy="60" r="9.5" fill="none" stroke="#f87171" stroke-width="1.6" stroke-dasharray="3 2"/>

    <!-- Quân trắng: hai quân sẵn, một quân đi lên ghép mill -->
    <use href="#pw" x="46.7" y="26.7"/>
    <use href="#pw" x="113.3" y="26.7"/>
    <use href="#pw" x="113.3" y="93.3"/>
    <g class="slide"><use href="#pw" x="80" y="26.7"/></g>
  </g>
</svg>
