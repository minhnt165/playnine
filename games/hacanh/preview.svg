<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tàu đổ bộ phun lửa hạ dần xuống bãi ×5 giữa núi.
       Tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động. Nền ô lấy từ preview.bg trong game.json. -->
  <style>
    .ship { animation: descend 4s cubic-bezier(.3, .1, .4, 1) infinite; }
    .flame { animation: flame 4s linear infinite; transform-origin: 99px 66px; }
    .flick { animation: flick .12s steps(2) infinite; transform-origin: 99px 66px; }
    .pad5 { animation: glow 4s ease-in-out infinite; }
    @keyframes descend {
      0% { transform: translate(-26px, -46px) rotate(14deg); }
      35% { transform: translate(-6px, -24px) rotate(-6deg); }
      72%, 92% { transform: translate(0, 0) rotate(0); }
      100% { transform: translate(0, 0) rotate(0); opacity: 0; }
    }
    @keyframes flame { 0%, 68% { opacity: 1; } 72%, 100% { opacity: 0; } }
    @keyframes flick { 50% { transform: scaleY(.7); } }
    @keyframes glow { 0%, 70% { stroke-width: 3; } 78% { stroke-width: 5; } 92%, 100% { stroke-width: 3; } }
    @media (prefers-reduced-motion: reduce) {
      .ship, .flame, .flick, .pad5 { animation: none; }
      .ship { transform: translate(0, -12px); }
    }
  </style>
  <g fill="#fff">
    <circle cx="18" cy="14" r="1" opacity=".8"/>
    <circle cx="44" cy="30" r=".8" opacity=".6"/>
    <circle cx="70" cy="10" r="1" opacity=".7"/>
    <circle cx="128" cy="18" r="1.1" opacity=".8"/>
    <circle cx="146" cy="40" r=".8" opacity=".6"/>
    <circle cx="112" cy="36" r=".7" opacity=".5"/>
  </g>
  <!-- núi -->
  <path d="M0 98 10 86 20 92 28 92 36 92 44 70 56 84 64 60 74 80 87 80 111 80 118 64 128 76 136 90 146 90 156 82 160 86V120H0z" fill="#262447"/>
  <path d="M0 98 10 86 20 92 28 92 36 92 44 70 56 84 64 60 74 80 87 80 111 80 118 64 128 76 136 90 146 90 156 82 160 86" fill="none" stroke="#c9b8ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- bãi đáp -->
  <path d="M15 92h21" stroke="#69db7c" stroke-width="3" stroke-linecap="round"/>
  <path class="pad5" d="M88 80h22" stroke="#ff7ac6" stroke-width="3" stroke-linecap="round"/>
  <path d="M137 90h9" stroke="#ffc94d" stroke-width="3" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="8" text-anchor="middle">
    <text x="25.5" y="102" fill="#69db7c">×2</text>
    <text x="99" y="91" fill="#ff7ac6">×5</text>
    <text x="141.5" y="100" fill="#ffc94d">×3</text>
  </g>
  <!-- tàu (đứng trên bãi ×5 ở vị trí gốc; hoạt hình dịch nó từ trên cao xuống) -->
  <g class="ship">
    <g class="flame"><path class="flick" d="M96.5 68h5L99 76z" fill="#ffb347"/></g>
    <g fill="#20244a" stroke="#e6f9ff" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
      <path d="M94 64.5 90 79M104 64.5 108 79M88 79h4M106 79h4" fill="none"/>
      <path d="M97 65h4l1 3h-6z"/>
      <rect x="92" y="59" width="14" height="6" rx="1"/>
      <path d="M93.5 59l.5-5 3-2.5h4l3 2.5.5 5z"/>
    </g>
    <circle cx="99" cy="55.5" r="1.8" fill="#7df9ff"/>
  </g>
</svg>
