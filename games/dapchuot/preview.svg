<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: tự chứa, hoạt hình bằng CSS, tắt khi người dùng giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt.
       Sáu hang, chuột thay nhau trồi lên, búa đập trúng con ở giữa hàng trên (+1). -->
  <style>
    .pop { transform: translateY(44px); }
    .a { animation: a 3.2s ease-in-out infinite; }
    .b { animation: b 3.2s ease-in-out infinite; }
    .c { animation: c 3.2s ease-in-out infinite; }
    .g { animation: g 3.2s ease-in-out infinite; }
    .hammer { opacity: 0; transform-origin: 112px 52px; animation: swing 3.2s ease-out infinite; }
    .plus { opacity: 0; animation: plus 3.2s ease-out infinite; }
    .burst { opacity: 0; transform-origin: 80px 40px; animation: burst 3.2s ease-out infinite; }
    /* con giữa hàng trên: trồi, bị đập, lặn nhanh */
    @keyframes a { 0% { transform: translateY(44px); } 8%, 30% { transform: translateY(0); } 33% { transform: translateY(6px); } 42%, 100% { transform: translateY(44px); } }
    @keyframes b { 0%, 30% { transform: translateY(44px); } 38%, 62% { transform: translateY(0); } 70%, 100% { transform: translateY(44px); } }
    @keyframes c { 0%, 55% { transform: translateY(44px); } 62%, 86% { transform: translateY(0); } 94%, 100% { transform: translateY(44px); } }
    @keyframes g { 0%, 12% { transform: translateY(44px); } 20%, 40% { transform: translateY(0); } 48%, 100% { transform: translateY(44px); } }
    @keyframes swing { 0%, 18% { opacity: 0; transform: rotate(50deg); } 20% { opacity: 1; transform: rotate(50deg); } 29% { transform: rotate(-6deg); } 31% { opacity: 1; transform: rotate(0); } 40%, 100% { opacity: 0; transform: rotate(12deg); } }
    @keyframes burst { 0%, 28% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; } 40%, 100% { opacity: 0; transform: scale(1.2); } }
    @keyframes plus { 0%, 29% { opacity: 0; transform: translateY(6px); } 33% { opacity: 1; transform: translateY(0); } 50% { opacity: 1; } 58%, 100% { opacity: 0; transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) {
      .a, .b, .c, .g, .hammer, .plus, .burst { animation: none; }
      .a, .c { transform: none; }
      .plus { opacity: 1; }
    }
  </style>
  <defs>
    <!-- Chuột: khung 40×40, đáy ở y = 40 (ngang tâm hang) -->
    <g id="m">
      <circle cx="9" cy="12" r="4.5" fill="#8f5b3a"/><circle cx="9" cy="12" r="2.2" fill="#ff8fae"/>
      <circle cx="31" cy="12" r="4.5" fill="#8f5b3a"/><circle cx="31" cy="12" r="2.2" fill="#ff8fae"/>
      <path d="M5 44V24C5 12 12 5 20 5s15 7 15 19v20z" fill="#8f5b3a"/>
      <ellipse cx="20" cy="35" rx="10" ry="10" fill="#e7bf95"/>
      <ellipse cx="15" cy="20" rx="3.4" ry="3.8" fill="#fff"/><ellipse cx="25" cy="20" rx="3.4" ry="3.8" fill="#fff"/>
      <circle cx="15.6" cy="21" r="1.9" fill="#24160c"/><circle cx="24.4" cy="21" r="1.9" fill="#24160c"/>
      <ellipse cx="20" cy="26" rx="3.6" ry="2.6" fill="#ff6f98"/>
      <rect x="17.8" y="28.4" width="2" height="3" rx=".6" fill="#fff"/><rect x="20.2" y="28.4" width="2" height="3" rx=".6" fill="#fff"/>
    </g>
    <g id="gm">
      <use href="#m"/>
      <path d="M5 44V24C5 12 12 5 20 5s15 7 15 19v20z" fill="#f2b200" opacity=".85"/>
      <ellipse cx="20" cy="35" rx="10" ry="10" fill="#ffeb99"/>
      <ellipse cx="15" cy="20" rx="3.4" ry="3.8" fill="#fff"/><ellipse cx="25" cy="20" rx="3.4" ry="3.8" fill="#fff"/>
      <circle cx="15.6" cy="21" r="1.9" fill="#24160c"/><circle cx="24.4" cy="21" r="1.9" fill="#24160c"/>
      <ellipse cx="20" cy="26" rx="3.6" ry="2.6" fill="#ff6f98"/>
      <path d="M36 4l1.4 3.2 3.2 1.4-3.2 1.4L36 13.2l-1.4-3.2-3.2-1.4 3.2-1.4z" fill="#fff6b0"/>
    </g>
    <g id="pit"><ellipse cx="0" cy="0" rx="17" ry="6" fill="#24150b"/></g>
    <g id="lip"><path d="M-19 0c0-2 5-2.6 19-2.6S19-2 19 0c0 4.5-8.5 7.6-19 7.6S-19 4.5-19 0z" fill="#a8703f" stroke="#6a4026" stroke-width="1.5"/></g>
    <clipPath id="c1"><rect x="10" y="0" width="50" height="60"/></clipPath>
    <clipPath id="c2"><rect x="55" y="0" width="50" height="60"/></clipPath>
    <clipPath id="c3"><rect x="100" y="0" width="50" height="60"/></clipPath>
    <clipPath id="c4"><rect x="10" y="50" width="50" height="48"/></clipPath>
    <clipPath id="c5"><rect x="55" y="50" width="50" height="48"/></clipPath>
    <clipPath id="c6"><rect x="100" y="50" width="50" height="48"/></clipPath>
  </defs>

  <!-- hàng trên (tâm hang y = 60) -->
  <use href="#pit" x="35" y="60"/><use href="#pit" x="80" y="60"/><use href="#pit" x="125" y="60"/>
  <g clip-path="url(#c1)"><g class="pop g"><use href="#gm" x="15" y="20"/></g></g>
  <g clip-path="url(#c2)"><g class="pop a"><use href="#m" x="60" y="20"/></g></g>
  <g clip-path="url(#c3)"><g class="pop c"><use href="#m" x="105" y="20"/></g></g>
  <use href="#lip" x="35" y="60"/><use href="#lip" x="80" y="60"/><use href="#lip" x="125" y="60"/>

  <!-- hàng dưới (tâm hang y = 98) -->
  <use href="#pit" x="35" y="98"/><use href="#pit" x="80" y="98"/><use href="#pit" x="125" y="98"/>
  <g clip-path="url(#c4)"><g class="pop c"><use href="#m" x="15" y="58"/></g></g>
  <g clip-path="url(#c6)"><g class="pop b"><use href="#m" x="105" y="58"/></g></g>
  <use href="#lip" x="35" y="98"/><use href="#lip" x="80" y="98"/><use href="#lip" x="125" y="98"/>

  <!-- tia sáng, búa, điểm -->
  <path class="burst" d="M80 22l3 11 10-6-6 10 11 3-11 3 6 10-10-6-3 11-3-11-10 6 6-10-11-3 11-3-6-10 10 6z" fill="#ffe45c"/>
  <g class="hammer">
    <path d="M84 30l28 22" stroke="#7a4a22" stroke-width="7" stroke-linecap="round"/>
    <path d="M84 30l28 22" stroke="#c98a4b" stroke-width="4" stroke-linecap="round"/>
    <g transform="rotate(-52 80 27)">
      <rect x="64" y="20" width="32" height="15" rx="4.5" fill="#e5483d" stroke="#8e1f1a" stroke-width="2"/>
      <rect x="61" y="18.5" width="6" height="18" rx="2.5" fill="#d8dee8" stroke="#5c6380" stroke-width="1.6"/>
      <rect x="93" y="18.5" width="6" height="18" rx="2.5" fill="#d8dee8" stroke="#5c6380" stroke-width="1.6"/>
    </g>
  </g>
  <text class="plus" x="96" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#fff" stroke="#3b2410" stroke-width="3" paint-order="stroke">+1</text>
</svg>
