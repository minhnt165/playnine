<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: đề 3 3 8 8 giải từng bước trên bàn nỉ 2×2:
       8 ÷ 3 = 8/3 → 3 − 8/3 = 1/3 → 8 ÷ 1/3 = 24. Nền trong suốt (nền thẻ lấy từ preview.bg);
       tắt hoạt hình khi giảm chuyển động (khi đó chỉ hiện bốn lá của đề). -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 800; text-anchor: middle; }
    .card rect { fill: #fffdf6; }
    .card text { font-size: 22px; fill: #23263a; }
    .card .s { font-size: 8px; font-weight: 400; }
    .red text { fill: #c92a2a; }
    .slot { fill: none; stroke: rgba(255, 255, 255, .2); stroke-width: 1.2; stroke-dasharray: 3 2.5; }
    .res rect { fill: #f6b73c; stroke: #ffd43b; stroke-width: 2; }
    .res text { fill: #3d2600; }
    .res .f { font-size: 13px; }
    .res line { stroke: #3d2600; stroke-width: 1.8; }
    .chip circle { fill: #d9480f; stroke: #fff; stroke-width: 1.5; }
    .chip text { fill: #fff; font-size: 14px; }
    .anim { animation: 9s linear infinite; }
    .res, .chip { opacity: 0; }
    @keyframes c-sel { 0%, 12% { opacity: 1; } 15%, 93% { opacity: 0; } 97%, 100% { opacity: 1; } }
    @keyframes c1 { 0%, 40% { opacity: 1; } 43%, 93% { opacity: 0; } 97%, 100% { opacity: 1; } }
    @keyframes c3 { 0%, 66% { opacity: 1; } 69%, 93% { opacity: 0; } 97%, 100% { opacity: 1; } }
    @keyframes r1 { 0%, 12% { opacity: 0; } 15%, 40% { opacity: 1; } 43%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 40% { opacity: 0; } 43%, 66% { opacity: 1; } 69%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 66% { opacity: 0; } 69%, 90% { opacity: 1; } 93%, 100% { opacity: 0; } }
    @keyframes k1 { 0%, 4% { opacity: 0; } 6%, 13% { opacity: 1; } 15%, 100% { opacity: 0; } }
    @keyframes k2 { 0%, 31% { opacity: 0; } 33%, 41% { opacity: 1; } 43%, 100% { opacity: 0; } }
    @keyframes k3 { 0%, 57% { opacity: 0; } 59%, 67% { opacity: 1; } 69%, 100% { opacity: 0; } }
    @keyframes glow { 0%, 70% { transform: scale(1); } 76% { transform: scale(1.1); } 82%, 100% { transform: scale(1); } }
    .r3 g { transform-box: fill-box; transform-origin: center; animation: glow 9s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .anim, .r3 g { animation: none !important; }
    }
  </style>
  <!-- Bàn nỉ -->
  <rect x="30" y="4" width="100" height="112" rx="10" fill="#1c6448"/>
  <rect x="31.5" y="5.5" width="97" height="109" rx="9" fill="none" stroke="#2f8a64" stroke-width="1.5"/>
  <!-- Ô trống phía dưới các lá -->
  <rect class="slot" x="36" y="10" width="42" height="48" rx="5"/>
  <rect class="slot" x="82" y="10" width="42" height="48" rx="5"/>
  <rect class="slot" x="36" y="62" width="42" height="48" rx="5"/>
  <rect class="slot" x="82" y="62" width="42" height="48" rx="5"/>
  <!-- Bốn lá của đề: 3♠ 3♥ / 8♦ 8♣ -->
  <g class="card anim" style="animation-name:c-sel"><rect x="36" y="10" width="42" height="48" rx="5"/><text x="57" y="42">3</text><text class="s" x="42" y="19">♠</text></g>
  <g class="card red anim" style="animation-name:c1"><rect x="82" y="10" width="42" height="48" rx="5"/><text x="103" y="42">3</text><text class="s" x="88" y="19">♥</text></g>
  <g class="card red anim" style="animation-name:c-sel"><rect x="36" y="62" width="42" height="48" rx="5"/><text x="57" y="94">8</text><text class="s" x="42" y="71">♦</text></g>
  <g class="card anim" style="animation-name:c3"><rect x="82" y="62" width="42" height="48" rx="5"/><text x="103" y="94">8</text><text class="s" x="88" y="71">♣</text></g>
  <!-- Kết quả ở ô trên trái: 8/3 → 1/3 → 24 -->
  <g class="res anim" style="animation-name:r1"><rect x="36" y="10" width="42" height="48" rx="5"/><text class="f" x="57" y="30">8</text><line x1="50" y1="34" x2="64" y2="34"/><text class="f" x="57" y="48">3</text></g>
  <g class="res anim" style="animation-name:r2"><rect x="36" y="10" width="42" height="48" rx="5"/><text class="f" x="57" y="30">1</text><line x1="50" y1="34" x2="64" y2="34"/><text class="f" x="57" y="48">3</text></g>
  <g class="res r3 anim" style="animation-name:r3"><g><rect x="36" y="10" width="42" height="48" rx="5"/><text x="57" y="42" style="font-size:20px">24</text></g></g>
  <!-- Phép tính đang dùng, giữa bàn -->
  <g class="chip anim" style="animation-name:k1"><circle cx="80" cy="60" r="10"/><text x="80" y="65">÷</text></g>
  <g class="chip anim" style="animation-name:k2"><circle cx="80" cy="60" r="10"/><text x="80" y="65">−</text></g>
  <g class="chip anim" style="animation-name:k3"><circle cx="80" cy="60" r="10"/><text x="80" y="65">÷</text></g>
</svg>
