    <use href="#spade" transform="translate(51.4 50.4) rotate(180) scale(.3)" fill="#191b31"/>
    <!-- Chữ 8 vẽ bằng hai vòng tròn (không phụ thuộc font) -->
    <circle cx="39.5" cy="26" r="5.2" fill="none" stroke="#191b31" stroke-width="3.8"/>
    <circle cx="39.5" cy="37.6" r="6.4" fill="none" stroke="#191b31" stroke-width="3.8"/>
