<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: ba máy cầm lá úp, giữa là nọc và chồng bài (7♥, chất đang theo ♥).
       Bạn đánh 7♠ (cùng bậc, chất đổi sang ♠), rồi đánh lá 8♣ và gọi chất ♦ (huy hiệu chất viền hổ phách).
       Hoạt hình CSS, tắt khi người dùng giảm chuyển động (hiện trạng thái cuối).
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt. -->
  <style>
    .face { fill: #fffefb; stroke: #14162b; stroke-opacity: .28; stroke-width: .6; }
    .rk { font: 800 10px system-ui, sans-serif; }
    .red { fill: #c62828; }
    .blk { fill: #191b31; }
    .hl { fill: none; stroke: #ffc53d; stroke-width: 1.6; }
    .dim { fill: #0b1d14; opacity: .32; }
    .p1 { animation: p1 6s cubic-bezier(.3, .7, .3, 1) infinite; }
    .p2 { animation: p2 6s cubic-bezier(.3, .7, .3, 1) infinite; }
    .ring1, .ring2 { animation: ring 6s step-end infinite; }
    .ring2 { animation-name: ring2; }
    .chH { animation: chH 6s step-end infinite; }
    .chS { opacity: 0; animation: chS 6s step-end infinite; }
    .chD { opacity: 0; animation: chD 6s step-end infinite; }
    .pop { transform-box: fill-box; transform-origin: 50% 50%; animation: pop 6s ease-out infinite; }
    @keyframes p1 { 0%, 10% { transform: translate(0px, 0px); opacity: 1; } 26%, 92% { transform: translate(35px, -31px); opacity: 1; } 96% { transform: translate(35px, -31px); opacity: 0; } 97% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
    @keyframes p2 { 0%, 48% { transform: translate(0px, 0px); opacity: 1; } 64%, 92% { transform: translate(-4px, -33px); opacity: 1; } 96% { transform: translate(-4px, -33px); opacity: 0; } 97% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
    @keyframes ring { 0% { opacity: 1; } 12% { opacity: 0; } 97% { opacity: 1; } }
    @keyframes ring2 { 0% { opacity: 1; } 50% { opacity: 0; } 97% { opacity: 1; } }
    @keyframes chH { 0% { opacity: 1; } 26% { opacity: 0; } 97% { opacity: 1; } }
    @keyframes chS { 0% { opacity: 0; } 26% { opacity: 1; } 64% { opacity: 0; } }
    @keyframes chD { 0% { opacity: 0; } 64% { opacity: 1; } 97% { opacity: 0; } }
    @keyframes pop { 0%, 64% { transform: scale(1); } 68% { transform: scale(1.25); } 74%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .ring1, .ring2, .chH, .chS, .chD, .pop { animation: none; }
      .p1 { transform: translate(35px, -31px); }
      .p2 { transform: translate(-4px, -33px); }
      .ring1, .ring2, .chH, .chS { opacity: 0; }
      .chD { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="bk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#4b30c9"/></linearGradient>
    <symbol id="S" viewBox="0 0 24 24"><path d="M12 1.8c.5.6 9.6 7.2 9.6 12.9 0 2.9-2.3 5.1-5 5.1-1.6 0-3-.7-3.8-1.9.3 1.8 1 3.1 2.5 4.5H8.7c1.5-1.4 2.2-2.7 2.5-4.5-.8 1.2-2.2 1.9-3.8 1.9-2.7 0-5-2.2-5-5.1C2.4 9 11.5 2.4 12 1.8z"/></symbol>
    <symbol id="H" viewBox="0 0 24 24"><path d="M12 21.6c-.5-.5-9.7-7-9.7-13.2 0-3.2 2.4-5.6 5.5-5.6 1.8 0 3.3.9 4.2 2.4.9-1.5 2.4-2.4 4.2-2.4 3.1 0 5.5 2.4 5.5 5.6 0 6.2-9.2 12.7-9.7 13.2z"/></symbol>
    <symbol id="D" viewBox="0 0 24 24"><path d="M12 1.4c2.3 3.8 5 7.3 8.6 10.6-3.6 3.3-6.3 6.8-8.6 10.6-2.3-3.8-5-7.3-8.6-10.6C7 8.7 9.7 5.2 12 1.4z"/></symbol>
    <symbol id="C" viewBox="0 0 24 24"><circle cx="12" cy="6.9" r="4.6"/><circle cx="6.6" cy="13.9" r="4.6"/><circle cx="17.4" cy="13.9" r="4.6"/><path d="M10 9.6h4l-.6 4.4H10.6z"/><path d="M12 12.6c-.1 4.1-.9 6.9-3.2 9.7h6.4c-2.3-2.8-3.1-5.6-3.2-9.7z"/></symbol>
    <!-- Lưng lá nhỏ (máy) -->
    <g id="back"><rect width="13" height="18" rx="2" fill="url(#bk)" stroke="#2f1c94" stroke-width=".5"/><rect x="1.6" y="1.6" width="9.8" height="14.8" rx="1.2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".6"/></g>
    <g id="bigback"><rect width="26" height="36" rx="3" fill="url(#bk)" stroke="#2f1c94" stroke-width=".6"/><rect x="3" y="3" width="20" height="30" rx="2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".9"/><path d="M13 12.5c.4 2.6 2.3 4.5 4.9 4.9-2.6.4-4.5 2.3-4.9 4.9-.4-2.6-2.3-4.5-4.9-4.9 2.6-.4 4.5-2.3 4.9-4.9z" fill="#fff" opacity=".9"/></g>
  </defs>

  <!-- Bắc: 5 lá úp xòe trên cùng -->
  <g transform="translate(58 4)"><use href="#back"/><use href="#back" x="7"/><use href="#back" x="14"/><use href="#back" x="21"/><use href="#back" x="28"/></g>
  <!-- Tây, Đông: chồng lá úp hai bên -->
  <g transform="translate(8 36)"><use href="#back"/><use href="#back" y="4"/><use href="#back" y="8"/><use href="#back" y="12"/></g>
  <g transform="translate(139 36)"><use href="#back"/><use href="#back" y="4"/><use href="#back" y="8"/></g>

  <!-- Nọc -->
  <use href="#bigback" x="47" y="40"/>
  <use href="#bigback" x="46" y="39"/>
  <!-- Chồng bài: 7♥ đang trên cùng -->
  <g transform="rotate(-4 97 57)">
    <rect class="face" x="84" y="39" width="26" height="36" rx="3"/>
    <text class="rk red" x="86.5" y="48.5">7</text>
    <use href="#H" class="red" x="101" y="41.5" width="7" height="7"/>
    <use href="#H" class="red" x="90" y="53" width="14" height="14"/>
  </g>

  <!-- Huy hiệu chất đang phải theo: ♥ → ♠ → ♦ (gọi bằng lá 8) -->
  <g class="pop">
    <circle cx="117" cy="73" r="8" fill="#fffefb" stroke="#0e3a27" stroke-width="1.2"/>
    <use class="chH red" href="#H" x="112" y="68" width="10" height="10"/>
    <use class="chS blk" href="#S" x="112" y="68" width="10" height="10"/>
    <g class="chD"><circle cx="117" cy="73" r="9.2" fill="none" stroke="#ffc53d" stroke-width="1.8"/><use class="red" href="#D" x="112" y="68" width="10" height="10"/></g>
  </g>

  <!-- Bài của bạn: 9♣, 7♠ (nhô lên, đánh được), K♦, 8♣ (nhô lên), 2♦ -->
  <g transform="rotate(-10 43 100)">
    <rect class="face" x="30" y="82" width="26" height="36" rx="3"/>
    <text class="rk blk" x="32.5" y="91.5">9</text>
    <use href="#C" class="blk" x="47" y="84.5" width="7" height="7"/>
    <rect class="dim" x="30" y="82" width="26" height="36" rx="3"/>
  </g>
  <g class="p1">
    <g transform="rotate(-4 63 94)">
      <rect class="face" x="50" y="76" width="26" height="36" rx="3"/>
      <rect class="hl ring1" x="50" y="76" width="26" height="36" rx="3"/>
      <text class="rk blk" x="52.5" y="85.5">7</text>
      <use href="#S" class="blk" x="67" y="78.5" width="7" height="7"/>
      <use href="#S" class="blk" x="56" y="90" width="14" height="14"/>
    </g>
  </g>
  <g transform="rotate(2 83 100)">
    <rect class="face" x="70" y="82" width="26" height="36" rx="3"/>
    <text class="rk red" x="72.5" y="91.5">K</text>
    <use href="#D" class="red" x="87" y="84.5" width="7" height="7"/>
    <rect class="dim" x="70" y="82" width="26" height="36" rx="3"/>
  </g>
  <g class="p2">
    <g transform="rotate(6 103 94)">
      <rect class="face" x="90" y="76" width="26" height="36" rx="3"/>
      <rect class="hl ring2" x="90" y="76" width="26" height="36" rx="3"/>
      <text class="rk blk" x="92.5" y="85.5">8</text>
      <use href="#C" class="blk" x="107" y="78.5" width="7" height="7"/>
      <use href="#C" class="blk" x="96" y="90" width="14" height="14"/>
    </g>
  </g>
  <g transform="rotate(11 123 100)">
    <rect class="face" x="110" y="84" width="26" height="36" rx="3"/>
    <text class="rk red" x="112.5" y="93.5">2</text>
    <use href="#D" class="red" x="127" y="86.5" width="7" height="7"/>
    <rect class="dim" x="110" y="84" width="26" height="36" rx="3"/>
  </g>
</svg>
