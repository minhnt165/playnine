<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Ảnh xem trước trên thẻ game ở cổng: cột 3 viên rơi vào giếng, nối hàng ngang 3 viên hồng ngọc,
       hàng nhấp nháy rồi biến mất, hai viên phía trên rơi xuống. Hoạt hình bằng CSS, tắt khi giảm chuyển động.
       Nền ô xem trước lấy từ preview.bg trong game.json; ảnh này để nền trong suốt. -->
  <style>
    .fall { animation: fall 3.2s infinite; }
    .pop { animation: pop 3.2s infinite; transform-box: fill-box; transform-origin: center; }
    .settle { animation: settle 3.2s infinite; }
    @keyframes fall { 0% { transform: translateY(-74px); animation-timing-function: ease-in; } 34%, 100% { transform: translateY(0); } }
    @keyframes pop {
      0%, 40% { opacity: 1; transform: scale(1); }
      46%, 58% { opacity: .35; }
      52%, 64% { opacity: 1; transform: scale(1); }
      74%, 100% { opacity: 0; transform: scale(.2); }
    }
    @keyframes settle { 0%, 76% { transform: translateY(0); } 86%, 100% { transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .fall, .pop, .settle { animation: none; } }
  </style>
  <defs>
    <radialGradient id="gr" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffb0b5"/><stop offset=".55" stop-color="#e5484d"/><stop offset="1" stop-color="#8f1625"/></radialGradient>
    <radialGradient id="ga" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd8a8"/><stop offset=".55" stop-color="#f08c2e"/><stop offset="1" stop-color="#9a4a0b"/></radialGradient>
    <radialGradient id="gy" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff4b0"/><stop offset=".55" stop-color="#f2c230"/><stop offset="1" stop-color="#8f6a05"/></radialGradient>
    <radialGradient id="gg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b0f5cf"/><stop offset=".55" stop-color="#25b468"/><stop offset="1" stop-color="#0d6b39"/></radialGradient>
    <radialGradient id="gb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b4d2ff"/><stop offset=".55" stop-color="#3b7ff0"/><stop offset="1" stop-color="#173f9e"/></radialGradient>
    <radialGradient id="gp" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ead0ff"/><stop offset=".55" stop-color="#a455f0"/><stop offset="1" stop-color="#5b1c99"/></radialGradient>
    <!-- Mỗi màu một hình: tròn, tam giác, thoi, vuông vát, lục giác, sao (tâm 0,0) -->
    <symbol id="R" overflow="visible"><circle r="4.3" fill="url(#gr)" stroke="#8f1625" stroke-width=".7"/><ellipse cx="-1.4" cy="-1.7" rx="1.2" ry=".7" fill="#fff" fill-opacity=".8"/></symbol>
    <symbol id="A" overflow="visible"><path d="M0-4.6 4.5 3.6H-4.5z" fill="url(#ga)" stroke="#9a4a0b" stroke-width=".7" stroke-linejoin="round"/></symbol>
    <symbol id="Y" overflow="visible"><path d="M0-4.6 3.8 0 0 4.6-3.8 0z" fill="url(#gy)" stroke="#8f6a05" stroke-width=".7" stroke-linejoin="round"/></symbol>
    <symbol id="G" overflow="visible"><path d="M-2.4-3.8h4.8l1.4 1.4v4.8l-1.4 1.4h-4.8l-1.4-1.4v-4.8z" fill="url(#gg)" stroke="#0d6b39" stroke-width=".7" stroke-linejoin="round"/></symbol>
    <symbol id="B" overflow="visible"><path d="M0-4.4 3.8-2.2v4.4L0 4.4-3.8 2.2v-4.4z" fill="url(#gb)" stroke="#173f9e" stroke-width=".7" stroke-linejoin="round"/></symbol>
    <symbol id="P" overflow="visible"><path d="M0-4.4 1.3-1.5 4.4-1.3 2-.7 2.8 3.9 0 2.2-2.8 3.9-2-.7-4.4-1.3-1.3-1.5z" fill="url(#gp)" stroke="#5b1c99" stroke-width=".7" stroke-linejoin="round"/></symbol>
  </defs>
  <!-- Giếng 6 cột -->
  <rect x="48" y="8" width="64" height="104" rx="6" fill="#0b0920" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.2"/>
  <rect x="60" y="10" width="10" height="100" fill="#ffffff" fill-opacity=".04"/>
  <rect x="80" y="10" width="10" height="100" fill="#ffffff" fill-opacity=".04"/>
  <rect x="100" y="10" width="10" height="100" fill="#ffffff" fill-opacity=".04"/>
  <!-- Ngọc nằm sẵn (cột tâm x = 55, 65, 75, 85, 95, 105; hàng đáy y = 105) -->
  <use href="#Y" x="55" y="105"/><use href="#G" x="65" y="105"/><use href="#B" x="75" y="105"/>
  <use href="#P" x="85" y="105"/><use href="#Y" x="95" y="105"/><use href="#A" x="105" y="105"/>
  <g class="pop"><use href="#R" x="55" y="95"/></g>
  <g class="pop"><use href="#R" x="65" y="95"/></g>
  <use href="#G" x="85" y="95"/><use href="#B" x="95" y="95"/><use href="#P" x="105" y="95"/>
  <use href="#Y" x="85" y="85"/><use href="#B" x="105" y="85"/><use href="#G" x="105" y="75"/>
  <!-- Cột 3 viên đang rơi: tím, lục, hồng (dưới cùng nối "hồng hồng hồng") -->
  <g class="fall">
    <g class="settle"><use href="#P" x="75" y="75"/><use href="#G" x="75" y="85"/></g>
    <g class="pop"><use href="#R" x="75" y="95"/></g>
  </g>
</svg>
